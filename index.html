<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar ROI Expert Master - V4.7 (Dynamic 3-Way Sliders)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVH0o1BUu39kVifgr7pP_vBJ51VPeVaLCAEb84HzduMiLB3D654-orIFFhg4fMHjq57Q/exec"; 

        const SOLAR_PACKAGES = {
            "1": [
                { name: "Package 1P 3kW", maxSize: 3.0, price: 89000, panels: 5, area: 15 },
                { name: "Package 1P 5kW", maxSize: 5.0, price: 139000, panels: 9, area: 27 }
            ],
            "3": [
                { name: "Package 3P 5kW", maxSize: 5.0, price: 149000, panels: 9, area: 27 },
                { name: "Package 3P 10kW", maxSize: 10.0, price: 239000, panels: 18, area: 54 },
                { name: "Package 3P 15kW", maxSize: 15.0, price: 329000, panels: 27, area: 81 },
                { name: "Package 3P 20kW", maxSize: 100.0, price: 429000, panels: 36, area: 108 }
            ]
        };

        const PROVINCE_SUN_HOURS = {
            "กรุงเทพมหานคร": 4.01, "กระบี่": 3.92, "กาญจนบุรี": 4.25, "กาฬสินธุ์": 4.30, "กำแพงเพชร": 4.18,
            "ขอนแก่น": 4.22, "จันทบุรี": 3.85, "ฉะเชิงเทรา": 4.05, "ชลบุรี": 4.12, "ชัยนาท": 4.20,
            "ชัยภูมิ": 4.28, "ชุมพร": 3.90, "เชียงราย": 3.80, "เชียงใหม่": 3.85, "ตรัง": 3.82,
            "ตราด": 3.75, "ตาก": 4.10, "นครนายก": 4.02, "นครปฐม": 4.10, "นครพนม": 4.15,
            "นครราชสีมา": 4.35, "นครศรีธรรมราช": 3.95, "นครสวรรค์": 4.25, "นนทบุรี": 4.01, "นราธิวาส": 3.78,
            "น่าน": 3.82, "บึงกาฬ": 4.10, "บุรีรัมย์": 4.32, "ปทุมธานี": 4.05, "ประจวบคีรีขันธ์": 4.15,
            "ปราจีนบุรี": 4.08, "ปัตตานี": 3.80, "พระนครศรีอยุธยา": 4.12, "พะเยา": 3.84, "พังงา": 3.88,
            "พัทลุง": 3.92, "พิจิตร": 4.18, "พิษณุโลก": 4.15, "เพชรบุรี": 4.12, "เพชรบูรณ์": 4.20,
            "แพร่": 3.86, "ภูเก็ต": 3.95, "มหาสารคาม": 4.25, "มุกดาหาร": 4.18, "แม่ฮ่องสอน": 3.75,
            "ยโสธร": 4.28, "ยะลา": 3.78, "ร้อยเอ็ด": 4.26, "ระนอง": 3.70, "ระยอง": 4.10,
            "ราชบุรี": 4.15, "ลพบุรี": 4.22, "ลำปาง": 3.88, "ลำพูน": 3.86, "เลย": 4.05,
            "ศรีสะเกษ": 4.30, "สกลนคร": 4.15, "สงขลา": 3.80, "สตูล": 3.85, "สมุทรปราการ": 4.00,
            "สมุทรสงคราม": 4.02, "สมุทรสาคร": 4.05, "สระแก้ว": 4.15, "สระบุรี": 4.18, "สิงห์บุรี": 4.20,
            "สุโขทัย": 4.15, "สุพรรณบุรี": 4.22, "สุราษฎร์ธานี": 3.90, "สุรินทร์": 4.32, "หนองคาย": 4.12,
            "หนองบัวลำภู": 4.20, "อ่างทอง": 4.18, "อำนาจเจริญ": 4.25, "อุดรธานี": 4.20, "อุตรดิตถ์": 4.05,
            "อุทัยธานี": 4.18, "อุบลราชธานี": 4.35
        };

        const SolarChart = ({ savingYearly, investment }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                const labels = Array.from({length: 25}, (_, i) => `ปีที่ ${i+1}`);
                let cumulativeSaving = 0;
                const dataSaving = labels.map((_, i) => {
                    cumulativeSaving += savingYearly * Math.pow(0.995, i);
                    return cumulativeSaving.toFixed(0);
                });

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'ประหยัดสะสม (บาท)',
                                data: dataSaving,
                                backgroundColor: 'rgba(16, 185, 129, 0.6)',
                                borderColor: '#10b981',
                                borderWidth: 1,
                                order: 2
                            },
                            {
                                label: 'เงินลงทุนสุทธิ (บาท)',
                                data: Array(25).fill(investment),
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                type: 'line',
                                fill: false,
                                pointRadius: 0,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: {
                            y: { beginAtZero: true, ticks: { callback: (v) => v.toLocaleString() + ' บ.' } }
                        }
                    }
                });
            }, [savingYearly, investment]);

            return <div className="h-64 w-full mt-4"><canvas ref={canvasRef}></canvas></div>;
        };

        const App = () => {
            const [bill, setBill] = useState(5000);
            const [province, setProvince] = useState("กรุงเทพมหานคร");
            
            // ใหม่: สัดส่วนการใช้ไฟ 3 ช่วงเวลาหลัก ผลรวมต้องได้ 100% เสมอ
            const [dayUsage, setDayUsage] = useState(50);      // 08:00 - 17:00 น.
            const [eveningUsage, setEveningUsage] = useState(30);  // 17:00 - 22:00 น.
            const [nightUsage, setNightUsage] = useState(20);    // 22:00 - 08:00 น.

            const [phase, setPhase] = useState("1");
            const [hasBattery, setHasBattery] = useState(false);
            const [batterySize, setBatterySize] = useState(5);
            const [isRegistered, setIsRegistered] = useState(false);
            const [showModal, setShowModal] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', tel: '' });

            const sunHours = PROVINCE_SUN_HOURS[province] || 4.0;
            const elecRate = 4.2;
            const touOnPeakRate = 5.8; 
            const batteryCostPerKWh = 13500;

            // ตรรกะแปรผันสไลด์บาร์อัตโนมัติ (3-Way Interactive Slider Logic)
            const handleDayChange = (val) => {
                const newDay = Number(val);
                const remaining = 100 - newDay;
                const currentLowerSum = eveningUsage + nightUsage;
                let newEve = 0;
                let newNight = 0;

                if (currentLowerSum === 0) {
                    newEve = Math.round(remaining / 2);
                    newNight = remaining - newEve;
                } else {
                    newEve = Math.round((eveningUsage / currentLowerSum) * remaining);
                    newNight = remaining - newEve;
                }
                setDayUsage(newDay);
                setEveningUsage(newEve);
                setNightUsage(newNight);
            };

            const handleEveningChange = (val) => {
                const newEve = Number(val);
                const remaining = 100 - newEve;
                const currentLowerSum = dayUsage + nightUsage;
                let newDay = 0;
                let newNight = 0;

                if (currentLowerSum === 0) {
                    newDay = Math.round(remaining / 2);
                    newNight = remaining - newDay;
                } else {
                    newDay = Math.round((dayUsage / currentLowerSum) * remaining);
                    newNight = remaining - newDay;
                }
                setEveningUsage(newEve);
                setDayUsage(newDay);
                setNightUsage(newNight);
            };

            const handleNightChange = (val) => {
                const newNight = Number(val);
                const remaining = 100 - newNight;
                const currentLowerSum = dayUsage + eveningUsage;
                let newDay = 0;
                let newEve = 0;

                if (currentLowerSum === 0) {
                    newDay = Math.round(remaining / 2);
                    newEve = remaining - newDay;
                } else {
                    newDay = Math.round((dayUsage / currentLowerSum) * remaining);
                    newEve = Math.round((eveningUsage / currentLowerSum) * remaining);
                    // ป้องกันความคลาดเคลื่อนจากเศษทศนิยม
                    const finalSum = newDay + newEve;
                    if (finalSum !== remaining) newEve += (remaining - finalSum);
                }
                setNightUsage(newNight);
                setDayUsage(newDay);
                setEveningUsage(newEve);
            };

            // คำนวณขนาด kWp แผงโซล่าเซลล์
            const solarSize = useMemo(() => {
                const totalUnitsPerMonth = bill / elecRate;
                const unitsNeededPerDay = totalUnitsPerMonth / 30;
                if (hasBattery) {
                    const dayUnits = unitsNeededPerDay * (dayUsage / 100);
                    const batteryUnits = batterySize / 0.9; 
                    return ((dayUnits + batteryUnits) / sunHours).toFixed(2);
                } else {
                    const dayUnits = unitsNeededPerDay * (dayUsage / 100);
                    return (dayUnits / sunHours).toFixed(2);
                }
            }, [bill, sunHours, dayUsage, hasBattery, batterySize]);

            // ค้นหาแพ็กเกจคงที่ของฝ่ายขาย
            const matchedPackage = useMemo(() => {
                const size = parseFloat(solarSize);
                const packages = SOLAR_PACKAGES[phase] || [];
                let selected = packages.find(p => size <= p.maxSize);
                if (!selected && packages.length > 0) {
                    selected = packages[packages.length - 1];
                }
                return selected;
            }, [solarSize, phase]);
            
            const isPhaseWarning = useMemo(() => {
                return phase === "1" && parseFloat(solarSize) > 5.0;
            }, [phase, solarSize]);

            // วิเคราะห์รอยต่อช่วงพีคหัวค่ำ 17:00 - 22:00 น.
            const eveningAnalysis = useMemo(() => {
                const totalUnitsPerMonth = bill / elecRate;
                const eveningUnitsPerMonth = totalUnitsPerMonth * (eveningUsage / 100);
                const eveningCostTOU = eveningUnitsPerMonth * touOnPeakRate; 
                
                let batterySavedMoney = 0;
                let coveragePercent = 0;
                if (hasBattery) {
                    const maxBatteryOutputPerMonth = batterySize * 0.9 * 30;
                    const coveredUnits = Math.min(eveningUnitsPerMonth, maxBatteryOutputPerMonth);
                    batterySavedMoney = coveredUnits * touOnPeakRate;
                    coveragePercent = Math.min(100, ((coveredUnits / eveningUnitsPerMonth) * 100));
                }

                return { eveningCostTOU, batterySavedMoney, coveragePercent };
            }, [bill, eveningUsage, hasBattery, batterySize]);

            // เงินลงทุนสุทธิ
            const estInvestment = useMemo(() => {
                if (!matchedPackage) return 0;
                let basePrice = matchedPackage.price;
                let batteryInvestment = hasBattery ? batterySize * batteryCostPerKWh : 0;
                return (basePrice + batteryInvestment).toFixed(0);
            }, [matchedPackage, hasBattery, batterySize]);

            // ยอดประหยัดรายเดือน
            const estSaving = useMemo(() => {
                const totalUnitsPerMonth = bill / elecRate;
                const dayUnitsPerMonth = totalUnitsPerMonth * (dayUsage / 100);
                const maxDayProduction = solarSize * sunHours * 30;
                
                const daySavings = Math.min(dayUnitsPerMonth, maxDayProduction) * elecRate;
                const eveningSavings = eveningAnalysis.batterySavedMoney; 
                
                return (daySavings + eveningSavings).toFixed(0);
            }, [solarSize, sunHours, dayUsage, bill, eveningAnalysis, hasBattery]);

            const cashFlowData = useMemo(() => {
                const years = Array.from({length: 25}, (_, i) => i + 1);
                let cumulative = 0;
                return years.map(year => {
                    const yearlySaving = estSaving * 12 * Math.pow(0.995, year - 1);
                    cumulative += yearlySaving;
                    const netProfit = cumulative - estInvestment;
                    return { year, yearlySaving, cumulative, netProfit };
                });
            }, [estSaving, estInvestment]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: formData.name,
                            message: formData.tel,
                            province: province,
                            email: `V4.7|Day:${dayUsage}%|Eve:${eveningUsage}%|Night:${nightUsage}%`
                        }),
                        mode: 'no-cors' 
                    });
                    setIsRegistered(true);
                    setShowModal(false);
                } catch (error) {
                    setIsRegistered(true);
                    setShowModal(false);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-blue-800 p-5 text-white shadow-xl flex justify-between items-center">
                        <h1 className="text-xl font-bold tracking-tighter">⭐ SolarHub Master</h1>
                        <span className="text-[10px] bg-red-600 px-2 py-1 rounded font-black uppercase tracking-widest animate-pulse">3-Way Slider V4.7</span>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-8 w-full flex-grow text-slate-800">
                        <section className="bg-white rounded-[2rem] shadow-2xl p-6 md:p-10 mb-8 border border-slate-100 animate-fade-in">
                            <div className="grid md:grid-cols-2 gap-x-8 gap-y-4 mb-8">
                                <div className="space-y-1">
                                    <label className="font-bold text-slate-700 text-sm ml-1">1. จังหวัดที่ติดตั้ง:</label>
                                    <select value={province} onChange={(e) => setProvince(e.target.value)}
                                        className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-lg cursor-pointer">
                                        {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => (<option key={p} value={p}>{p}</option>))}
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="font-bold text-slate-700 text-sm ml-1">2. ค่าไฟเฉลี่ยต่อเดือน (บาท):</label>
                                    <div className="relative">
                                        <input type="number" value={bill} onChange={(e) => setBill(e.target.value)}
                                            className="w-full p-4 text-3xl font-black border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none bg-slate-50" />
                                        <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-black text-xl">฿</span>
                                    </div>
                                </div>

                                <div className="md:col-span-2 space-y-2 mt-2">
                                    <label className="font-bold text-slate-700 text-sm ml-1">3. ระบบไฟฟ้าที่ใช้งานหน้างาน:</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => setPhase("1")}
                                            className={`p-4 rounded-2xl border-2 font-bold transition-all flex flex-col items-center ${phase === "1" ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-md' : 'border-slate-100 bg-slate-50 text-slate-400'}`}>
                                            <span className="text-lg">1 Phase</span>
                                        </button>
                                        <button onClick={() => setPhase("3")}
                                            className={`p-4 rounded-2xl border-2 font-bold transition-all flex flex-col items-center ${phase === "3" ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-md' : 'border-slate-100 bg-slate-50 text-slate-400'}`}>
                                            <span className="text-lg">3 Phase</span>
                                        </button>
                                    </div>
                                </div>

                                {/* จุดหลักที่เพิ่มและปรับปรุง: ระบบ 3-Way Slider แปรผันตามกันอัตโนมัติ */}
                                <div className="md:col-span-2 p-6 bg-slate-50 rounded-[2rem] border border-slate-100 space-y-5">
                                    <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                        <label className="font-black text-slate-800 text-sm">4. สัดส่วนพฤติกรรมการใช้ไฟแยกตามช่วงเวลา (รวมครบ 100%)</label>
                                        <span className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold">Auto-Balanced</span>
                                    </div>
                                    
                                    {/* Slider 1: 08:00 - 17:00 น. */}
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-slate-600">☀️ ช่วงกลางวัน (08:00 - 17:00 น.)</span>
                                            <span className="text-blue-600 text-lg font-black">{dayUsage}%</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={dayUsage} onChange={(e) => handleDayChange(e.target.value)}
                                            className="w-full h-2.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                    </div>

                                    {/* Slider 2: 17:00 - 22:00 น. */}
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-orange-600">🌆 ช่วงหัวค่ำ / On-Peak TOU (17:00 - 22:00 น.)</span>
                                            <span className="text-orange-600 text-lg font-black">{eveningUsage}%</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={eveningUsage} onChange={(e) => handleEveningChange(e.target.value)}
                                            className="w-full h-2.5 bg-orange-100 rounded-lg appearance-none cursor-pointer accent-orange-500" />
                                    </div>

                                    {/* Slider 3: 22:00 - 08:00 น. */}
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-purple-600">🌙 ช่วงดึก-เช้าตรู่ / Off-Peak TOU (22:00 - 08:00 น.)</span>
                                            <span className="text-purple-600 text-lg font-black">{nightUsage}%</span>
                                        </div>
                                        <input type="range" min="0" max="100" value={nightUsage} onChange={(e) => handleNightChange(e.target.value)}
                                            className="w-full h-2.5 bg-purple-100 rounded-lg appearance-none cursor-pointer accent-purple-500" />
                                    </div>
                                </div>

                                <div className="md:col-span-2 p-5 bg-blue-50/50 rounded-[1.5rem] border border-blue-100 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <label className="font-bold text-blue-900 text-sm">เพิ่มระบบแบตเตอรี่ (Hybrid Option)?</label>
                                        <button onClick={() => setHasBattery(!hasBattery)}
                                            className={`w-14 h-8 rounded-full transition-all flex items-center px-1 ${hasBattery ? 'bg-blue-600 justify-end' : 'bg-slate-300 justify-start'}`}>
                                            <div className="w-6 h-6 bg-white rounded-full shadow-md"></div>
                                        </button>
                                    </div>
                                    {hasBattery && (
                                        <div className="pt-2 animate-fade-in space-y-3">
                                            <label className="block text-xs font-bold text-blue-700">ขนาดความจุแบตเตอรี่: {batterySize} kWh</label>
                                            <input type="range" min="2" max="30" step="1" value={batterySize} onChange={(e) => setBatterySize(Number(e.target.value))}
                                                className="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer accent-blue-800" />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {isPhaseWarning && (
                                <div className="mb-6 p-4 bg-red-50 border-2 border-red-200 rounded-2xl text-red-700 flex items-start gap-3 animate-fade-in">
                                    <span className="text-xl mt-0.5">⚠️</span>
                                    <div>
                                        <p className="font-bold text-sm">ข้อแนะนำเชิงวิศวกรรม (Technical Alert):</p>
                                        <p className="text-xs mt-1 leading-relaxed">ขนาดระบบที่คำนวณได้คือ <strong>{solarSize} kWp</strong> เกินโควตา 1 Phase แนะนำให้เปลี่ยนเป็นระบบ <strong>3 Phase</strong></p>
                                    </div>
                                </div>
                            )}

                            {/* การ์ดวิเคราะห์ช่วงเวลาพีคหัวค่ำ 17:00 - 22:00 น. */}
                            <div className="mb-8 p-6 bg-gradient-to-r from-slate-900 to-slate-800 rounded-3xl text-white shadow-lg space-y-3 border border-slate-700 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 text-9xl">⚡</div>
                                <h4 className="text-orange-400 font-black text-xs uppercase tracking-widest flex items-center gap-1.5">
                                    ⭐ TOU ON-PEAK ANALYSIS (17:00 - 22:00 น.)
                                </h4>
                                <div className="grid md:grid-cols-2 gap-4 pt-1">
                                    <div>
                                        <p className="text-slate-400 text-[11px]">มูลค่าค่าไฟจริงในช่วงเวลาพีคหัวค่ำ:</p>
                                        <p className="text-2xl font-black text-slate-100">{Number(eveningAnalysis.eveningCostTOU).toLocaleString(undefined, {maximumFractionDigits:0})} <span className="text-sm font-bold text-slate-400">บาท/เดือน</span></p>
                                    </div>
                                    <div className="flex flex-col justify-center">
                                        <p className="text-slate-400 text-[11px]">สถานะการประหยัดพลังงาน:</p>
                                        {!hasBattery ? (
                                            <p className="text-xs text-orange-400 font-bold mt-1 bg-orange-950/40 p-2 rounded-xl border border-orange-900/40">⚠️ ดึงไฟหลวงเรท On-Peak 100% (แนะระบบ Hybrid เพื่อล็อกต้นทุน)</p>
                                        ) : (
                                            <div className="mt-1">
                                                <p className="text-xs text-emerald-400 font-black">🔋 แบตเตอรี่ช่วยจ่าย {eveningAnalysis.coveragePercent.toFixed(0)}% ของช่วงพีค</p>
                                                <p className="text-emerald-500 text-[11px] font-medium">เซฟเงินเพิ่มได้ {Number(eveningAnalysis.batterySavedMoney).toLocaleString(undefined, {maximumFractionDigits:0})} บ./เดือน</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 text-center md:text-left">
                                <div className="bg-white p-6 rounded-3xl border-2 border-blue-100 shadow-sm relative overflow-hidden">
                                    <p className="text-xs font-bold text-blue-600 uppercase mb-1 tracking-widest italic">Recommended Size</p>
                                    <div className="flex items-baseline justify-center md:justify-start gap-2">
                                        <span className="text-5xl font-black text-blue-900">{solarSize}</span>
                                        <span className="text-lg font-bold text-blue-700">kWp</span>
                                    </div>
                                    {matchedPackage && (
                                        <div className="mt-3 pt-3 border-t border-slate-100 text-left text-xs text-slate-500 space-y-1">
                                            <p>📦 <strong>แมตช์คงที่:</strong> {matchedPackage.name}</p>
                                            <p>☀️ <strong>จำนวนแผง:</strong> {matchedPackage.panels} แผง | 📐 <strong>พื้นที่:</strong> {matchedPackage.area} ตร.ม.</p>
                                        </div>
                                    )}
                                </div>
                                <div className="bg-white p-6 rounded-3xl border-2 border-emerald-100 shadow-sm text-center md:text-left flex flex-col justify-between">
                                    <div>
                                        <p className="text-xs font-bold text-emerald-600 uppercase mb-1 tracking-widest italic">Net Monthly Savings</p>
                                        <div className="flex items-baseline justify-center md:justify-start gap-2">
                                            <span className="text-5xl font-black text-emerald-900">{Number(estSaving).toLocaleString()}</span>
                                            <span className="text-lg font-bold text-emerald-700">บาท</span>
                                        </div>
                                    </div>
                                    <div className="mt-4 p-3 bg-slate-50 rounded-xl text-left text-xs text-slate-600">
                                        💰 <strong>ราคาแพ็กเกจติดตั้งสุทธิ:</strong> <span className="font-black text-blue-700 text-sm">{Number(estInvestment).toLocaleString()} บาท</span>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-8 border-t border-slate-100">
                                <h3 className="text-xl font-black text-slate-800 mb-6 text-center uppercase tracking-widest">⭐ Financial Return Simulation</h3>
                                <SolarChart savingYearly={estSaving * 12} investment={estInvestment} />
                                
                                <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
                                    <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">Payback Period</p>
                                        <p className="text-orange-600 text-4xl font-black">{(estInvestment / (estSaving * 12)).toFixed(1)} <span className="text-lg font-bold text-slate-500">ปี</span></p>
                                    </div>
                                    <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">25-Year Cumulative Profit</p>
                                        <p className="text-emerald-800 text-4xl font-black">
                                            {Number((estSaving * 12 * (1 - Math.pow(0.995, 25)) / 0.005)).toLocaleString(undefined, {maximumFractionDigits: 0})} <span className="text-lg font-bold text-slate-500">฿</span>
                                        </p>
                                    </div>
                                </div>

                                {/* Cash Flow Table */}
                                <div className="mt-12 overflow-hidden bg-white rounded-3xl border border-slate-100 shadow-lg">
                                    <div className="bg-slate-800 p-5 text-white flex justify-between items-center">
                                        <h4 className="font-black text-sm uppercase tracking-widest">⭐ Cash Flow Dashboard ({matchedPackage?.name || 'Fixed Pack'})</h4>
                                        <span className="text-[10px] bg-blue-600 px-3 py-1 rounded-full text-white font-bold">Audited Report</span>
                                    </div>
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50 border-b border-slate-100">
                                                <tr>
                                                    <th className="px-6 py-4 font-bold text-slate-500 uppercase text-[10px]">ปีที่</th>
                                                    <th className="px-6 py-4 font-bold text-slate-500 uppercase text-[10px]">ประหยัดต่อปี</th>
                                                    <th className="px-6 py-4 font-bold text-slate-500 uppercase text-[10px]">ประหยัดสะสม</th>
                                                    <th className="px-6 py-4 font-bold text-slate-500 uppercase text-[10px]">กำไรสุทธิสะสม</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {cashFlowData.map((item) => (
                                                    <tr key={item.year} className={`hover:bg-slate-50/50 transition-colors ${item.netProfit >= 0 ? 'bg-emerald-50/20' : ''}`}>
                                                        <td className="px-6 py-4 font-bold text-slate-700">{item.year}</td>
                                                        <td className="px-6 py-4 text-slate-600 font-medium">{item.yearlySaving.toLocaleString(undefined, {maximumFractionDigits:0})} บ.</td>
                                                        <td className="px-6 py-4 text-slate-600 font-medium">{item.cumulative.toLocaleString(undefined, {maximumFractionDigits:0})} บ.</td>
                                                        <td className={`px-6 py-4 font-black ${item.netProfit >= 0 ? 'text-emerald-600' : 'text-orange-500'}`}>
                                                            {item.netProfit >= 0 ? '+' : ''}{item.netProfit.toLocaleString(undefined, {maximumFractionDigits:0})} ฿
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="mt-10 p-8 bg-slate-900 rounded-[2rem] text-white space-y-6 shadow-2xl relative overflow-hidden">
                                    <h4 className="text-blue-400 font-black text-lg flex items-center gap-2 underline underline-offset-8">ENGINEERING & PACKAGE REFERENCES</h4>
                                    <div className="grid md:grid-cols-2 gap-6 relative z-10 text-[11px] text-slate-300 leading-relaxed">
                                        <div className="space-y-4">
                                            <p><strong>3-Way Balanced Profile:</strong> ตรรกะกระจายโหลดไฟฟ้าอัตโนมัติ ล็อกผลรวมค่าไฟฟ้าครอบคลุม 24 ชั่วโมงให้ครบ 100% ตลอดเวลา</p>
                                            <p><strong>Energy Yield Analysis:</strong> ผูกข้อมูลกับพิกัดความเข้มแดดจริงรายจังหวัด ({sunHours} ชม./วัน) หักค่าเสื่อมประสิทธิภาพวัสดุ 0.5% ต่อปี</p>
                                        </div>
                                        <div className="space-y-4">
                                            <p><strong>Hybrid Storage System:</strong> ระบบแบตเตอรี่ LFP บล็อกต้นทุนช่วงหัวค่ำ (17:00 - 22:00 น.) ตามโครงสร้างราคาพลังงานหมุนเวียน</p>
                                            <p><strong>Note:</strong> คำนวณแบบฐานปลอดภัยที่สุด (ยังไม่รวมเงินเฟ้อค่าไฟฟ้าผันแปรและมาตรการลดหย่อนภาษี 200,000 บาท)</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div className="bg-slate-900 rounded-[2rem] p-8 text-white flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl mb-12">
                            <div className="text-center md:text-left">
                                <h4 className="font-bold text-xl mb-1 text-blue-400">สนใจจองแพ็กเกจ {matchedPackage?.name} หรือขอใบเสนอราคา?</h4>
                                <p className="text-slate-400 text-sm">วิศวกรผู้เชี่ยวชาญพร้อมสแกนพื้นที่หน้างานและออกแบบระบบจริงให้ฟรี</p>
                            </div>
                            <a href="https://line.me/R/ti/p/~apichatkongsuk" target="_blank"
                                className="bg-[#06C755] hover:bg-[#05a346] text-white font-black py-4 px-8 rounded-2xl transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2 text-lg">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" className="w-5 h-5" />
                                ปรึกษาทาง LINE
                            </a>
                        </div>
                    </main>

                    {/* Login Modal */}
                    {showModal && !isRegistered && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-[2.5rem] p-8 md:p-12 max-w-md w-full shadow-2xl text-center border border-white/20 animate-fade-in">
                                <h3 className="text-2xl font-black mb-2 text-slate-800 italic">⭐ SolarHub ROI Audit</h3>
                                <p className="text-slate-500 text-sm mb-10 leading-relaxed font-medium">ระบุพิกัดและข้อมูลของคุณเพื่อประมวลผลรายงานแพ็กเกจ<br/>National & Phase-Specific Analysis</p>
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="text-left">
                                        <label className="text-[10px] font-bold text-slate-400 ml-3 mb-1 block uppercase tracking-[0.2em]">Installation Province</label>
                                        <select value={province} onChange={(e) => setProvince(e.target.value)}
                                            className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 cursor-pointer">
                                            {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => (<option key={p} value={p}>{p}</option>))}
                                        </select>
                                    </div>
                                    <input required type="text" placeholder="ชื่อ-นามสกุล ของคุณ" 
                                        className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                    <input required type="tel" placeholder="เบอร์โทรศัพท์ติดต่อ" 
                                        className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.tel} onChange={(e) => setFormData({...formData, tel: e.target.value})} />
                                    <button disabled={isLoading}
                                        className={`w-full ${isLoading ? 'bg-slate-400' : 'bg-blue-700 hover:bg-blue-800'} text-white font-black py-5 rounded-2xl mt-6 shadow-xl active:scale-95 transition-all text-lg uppercase tracking-widest`}>
                                        {isLoading ? 'Processing...' : 'Audit ROI Now'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
