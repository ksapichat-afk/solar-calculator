<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Solar ROI Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 1. วาง URL ที่ได้จาก Google Apps Script ตรงนี้ครับ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVH0o1BUu39kVifgr7pP_vBJ51VPeVaLCAEb84HzduMiLB3D654-orIFFhg4fMHjq57Q/exec"; 

        const App = () => {
            const [bill, setBill] = useState(5000);
            const [isRegistered, setIsRegistered] = useState(false);
            const [showModal, setShowModal] = useState(true);
            const [isLoading, setIsLoading] = useState(false);

            // ข้อมูลสำหรับลงทะเบียน
            const [formData, setFormData] = useState({ name: '', tel: '' });

            const solarSize = (bill / 4.2 / 30 / 3.8).toFixed(2);
            const estSaving = (solarSize * 3.8 * 30 * 4.2).toFixed(0);

            // 2. ฟังก์ชันส่งข้อมูลไปยัง Google Sheets
            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);

                try {
                    // ส่งข้อมูลไปที่ Google Apps Script
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: formData.name,
                            message: formData.tel, // ใน Apps Script เราใช้ชื่อตัวแปร message รับเบอร์โทร
                            email: "-",
                            province: "-"
                        }),
                        mode: 'no-cors' 
                    });

                    // ถ้าส่งสำเร็จ ให้ปิด Modal และแสดงหน้าคำนวณ
                    setIsRegistered(true);
                    setShowModal(false);
                } catch (error) {
                    console.error('Error:', error);
                    alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen">
                    <header className="bg-blue-600 p-4 text-white shadow-lg">
                        <h1 className="text-xl font-bold text-center">Solar Energy Calculator</h1>
                    </header>

                    <main className="max-w-4xl mx-auto p-6">
                        <section className="bg-white rounded-xl shadow-md p-8 mb-6">
                            <h2 className="text-2xl font-bold mb-4 text-blue-800 text-center">วิเคราะห์ความคุ้มค่า</h2>
                            <div className="mb-8">
                                <label className="block mb-2 font-bold">ค่าไฟเฉลี่ยต่อเดือน (บาท):</label>
                                <input 
                                    type="number" 
                                    value={bill} 
                                    onChange={(e) => setBill(e.target.value)}
                                    className="w-full p-4 text-2xl border-2 border-blue-100 rounded-lg focus:border-blue-500 outline-none"
                                />
                            </div>
                            <div className="grid md:grid-cols-2 gap-4">
                                <div className="bg-blue-50 p-6 rounded-lg text-center">
                                    <p className="text-sm text-blue-600">ขนาดติดตั้งที่แนะนำ</p>
                                    <p className="text-4xl font-bold">{solarSize} <span className="text-lg">kWp</span></p>
                                </div>
                                <div className="bg-green-50 p-6 rounded-lg text-center">
                                    <p className="text-sm text-green-600">ประหยัดได้ประมาณ/เดือน</p>
                                    <p className="text-4xl font-bold text-green-600">{Number(estSaving).toLocaleString()} <span className="text-lg">บาท</span></p>
                                </div>
                            </div>
                        </section>
                    </main>

                    {showModal && !isRegistered && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl">
                                <h3 className="text-xl font-bold mb-4 text-center">กรุณาลงทะเบียน</h3>
                                <p className="text-gray-500 text-sm mb-6 text-center">กรอกข้อมูลเพื่อดูผลการวิเคราะห์เชิงลึก</p>
                                <form onSubmit={handleSubmit}>
                                    <input 
                                        required 
                                        type="text" 
                                        placeholder="ชื่อ-นามสกุล" 
                                        className="w-full border p-3 rounded-lg mb-3"
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    />
                                    <input 
                                        required 
                                        type="tel" 
                                        placeholder="เบอร์โทรศัพท์" 
                                        className="w-full border p-3 rounded-lg mb-4"
                                        value={formData.tel}
                                        onChange={(e) => setFormData({...formData, tel: e.target.value})}
                                    />
                                    <button 
                                        disabled={isLoading}
                                        className={`w-full ${isLoading ? 'bg-gray-400' : 'bg-blue-600'} text-white font-bold py-3 rounded-lg transition`}
                                    >
                                        {isLoading ? 'กำลังส่งข้อมูล...' : 'เข้าสู่ระบบคำนวณ'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
