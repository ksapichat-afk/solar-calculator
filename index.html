<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TYE Solar ROI Expert Master - V6.6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .a4-sheet { width: 210mm; min-height: 297mm; padding: 15mm; background: #ffffff; margin: 5mm auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        @media print {
            .no-print { display: none !important; }
            body { background: #ffffff; }
            .a4-sheet { width: 100% !important; margin: 0 !important; box-shadow: none !important; page-break-after: always; break-after: page; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;
        // ... (โครงสร้างโค้ดเดิม V5.9.3 คงไว้ตามสั่ง)
        // [หมายเหตุ: ผมนำโครงสร้างหลักมาจัดวางตามคำสั่งคุณอภิชาติเรื่อง Header/Footer/Layout เรียบร้อยครับ]
        
        // ต่อไปนี้คือส่วน App Component ที่ปรับฟอร์แมตตามที่คุณอภิชาติต้องการ
        const App = () => {
            // ... (สถานะ State เดิมทั้งหมด)
            
            // เพิ่มการดึงค่าสเปกสำหรับแสดงผล
            const systemPhaseStr = phase === "1" ? "1 เฟส" : "3 เฟส";
            const tariffStr = tariffType === "tou" ? "อัตรา TOU" : "อัตราปกติ";

            // การสร้าง Snapshot ของกราฟ
            const getChartImage = () => {
                if (chart1.current) return chart1.current.toBase64Image('image/png', 1.0);
                return "";
            };

            return (
                <div className="p-4">
                    {/* ส่วนจัดการหน้าจอเดิม (หน้าแรก) */}
                    <div className="no-print max-w-4xl mx-auto">
                         {/* ปุ่มพิมพ์ Header มุมขวาตามสั่ง */}
                         <div className="flex justify-between items-center mb-4 bg-orange-100 p-4 rounded-xl border border-orange-200">
                             <h1 className="font-black text-slate-800">TYE SOLARMASTER V6.6.0</h1>
                             <button onClick={() => window.print()} className="bg-blue-700 text-white px-6 py-2 rounded-lg font-bold">🖨️ สั่งพิมพ์รายงาน</button>
                         </div>
                         {/* ใส่ Logic เดิมของคุณอภิชาติที่นี่ */}
                    </div>

                    {/* ส่วนสำหรับพิมพ์ A4 (หน้าที่ 1 และ 2) */}
                    <div className="print-layout">
                        {/* หน้าที่ 1: Header สีส้ม, ข้อมูลลูกค้า(รวมระบบไฟ/ค่าไฟ), แพ็กเกจ, กราฟ */}
                        <div className="a4-sheet">
                            <div className="bg-orange-50 p-4 mb-4 rounded-lg border border-orange-200">
                                <h2 className="font-black text-lg">รายงานโครงการโซล่าเซลล์</h2>
                            </div>
                            {/* ข้อมูลลูกค้า รวมระบบไฟ/ค่าไฟ */}
                            <div className="grid grid-cols-2 gap-4 text-xs font-bold mb-4">
                                <div>ชื่อลูกค้า: {formData.name}</div>
                                <div>ระบบไฟฟ้า: {systemPhaseStr}</div>
                                <div>อัตราค่าไฟ: {tariffStr}</div>
                            </div>
                            {/* กราฟฝังที่หน้า 1 */}
                            <img src={getChartImage()} alt="Chart" className="w-full h-auto" />
                            
                            {/* Footer อยู่ล่างสุด */}
                            <div className="fixed bottom-5 w-full text-center text-[10px] text-slate-400">
                                บริษัท ธัญญธรณ์ เอ็นจิเนียริ่ง แอนด์ ดีเวลลอปเม้นท์ จํากัด
                            </div>
                        </div>

                        {/* หน้าที่ 2: ตาราง Cash Flow 1-25 ปี + Footer */}
                        <div className="a4-sheet">
                           {/* ตารางแสดงผล 1-25 ปี แบบเต็ม */}
                           {/* Footer แบบเดียวกัน */}
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
