<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar ROI Expert Calculator - Master V3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVH0o1BUu39kVifgr7pP_vBJ51VPeVaLCAEb84HzduMiLB3D654-orIFFhg4fMHjq57Q/exec"; 

        const PROVINCE_SUN_HOURS = {
            "กรุงเทพมหานคร": 4.01, "เชียงใหม่": 3.85, "ขอนแก่น": 4.22, "นครราชสีมา": 4.35,
            "ชลบุรี": 4.12, "ภูเก็ต": 3.95, "สงขลา": 3.80, "สุราษฎร์ธานี": 3.90,
            "นนทบุรี": 4.01, "ปทุมธานี": 4.05, "สมุทรปราการ": 4.00, "ระยอง": 4.10,
            "นครปฐม": 4.10, "พิษณุโลก": 4.15, "อุดรธานี": 4.20
        };

        const SolarChart = ({ savingYearly, investment }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                const labels = Array.from({length: 25}, (_, i) => `ปีที่ ${i+1}`);
                let cumulativeSaving = 0;
                const dataSaving = labels.map((_, i) => {
                    cumulativeSaving += savingYearly * Math.pow(0.995, i);
                    return cumulativeSaving.toFixed(0);
                });

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'ประหยัดสะสม (บาท)',
                                data: dataSaving,
                                backgroundColor: 'rgba(16, 185, 129, 0.6)',
                                borderColor: '#10b981',
                                borderWidth: 1,
                                order: 2
                            },
                            {
                                label: 'เงินลงทุน (บาท)',
                                data: Array(25).fill(investment),
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                type: 'line',
                                fill: false,
                                pointRadius: 0,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { callback: (value) => value.toLocaleString() + ' บ.' }
                            }
                        }
                    }
                });
            }, [savingYearly, investment]);

            return <div className="h-64 w-full mt-4"><canvas ref={canvasRef}></canvas></div>;
        };

        const App = () => {
            const [bill, setBill] = useState(5000);
            const [province, setProvince] = useState("กรุงเทพมหานคร");
            const [dayUsage, setDayUsage] = useState(70); // State ใหม่
            const [isRegistered, setIsRegistered] = useState(false);
            const [showModal, setShowModal] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', tel: '' });

            const sunHours = PROVINCE_SUN_HOURS[province] || 4.0;
            const elecRate = 4.2;

            // Logic ใหม่: คำนวณตามพฤติกรรมการใช้ไฟกลางวัน
            const solarSize = useMemo(() => {
                const totalUnitsPerMonth = bill / elecRate;
                const dayUnitsPerDay = (totalUnitsPerMonth * (dayUsage / 100)) / 30;
                return (dayUnitsPerDay / sunHours).toFixed(2);
            }, [bill, sunHours, dayUsage]);
            
            const estInvestment = useMemo(() => {
                const size = parseFloat(solarSize);
                let pricePerKWp = 45000;
                if (size >= 3 && size < 5) pricePerKWp = 42000;
                else if (size >= 5 && size < 10) pricePerKWp = 38000;
                else if (size >= 10 && size < 20) pricePerKWp = 32000;
                else if (size >= 20) pricePerKWp = 28000;
                return (size * pricePerKWp).toFixed(0);
            }, [solarSize]);

            const estSaving = useMemo(() => {
                const saving = solarSize * sunHours * 30 * elecRate;
                return (saving * 0.995).toFixed(0); 
            }, [solarSize, sunHours]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: formData.name,
                            message: formData.tel,
                            province: province,
                            email: "V3.3-Behavior-Mode"
                        }),
                        mode: 'no-cors' 
                    });
                    setIsRegistered(true);
                    setShowModal(false);
                } catch (error) {
                    setIsRegistered(true);
                    setShowModal(false);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-blue-800 p-5 text-white shadow-xl text-center">
                        <h1 className="text-xl font-bold">SolarHub ROI <span className="text-xs bg-blue-600 px-2 py-1 rounded ml-2">BEHAVIOR-DRIVEN V3.3</span></h1>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-8 w-full flex-grow">
                        <section className="bg-white rounded-3xl shadow-2xl p-6 md:p-10 mb-8 border border-slate-100 animate-fade-in">
                            <div className="grid md:grid-cols-2 gap-x-8 gap-y-4 mb-10">
                                <div className="space-y-1">
                                    <label className="font-bold text-slate-700 text-sm ml-1">1. จังหวัดที่ติดตั้ง:</label>
                                    <select value={province} onChange={(e) => setProvince(e.target.value)}
                                        className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-lg cursor-pointer transition-all">
                                        {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => (<option key={p} value={p}>{p}</option>))}
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="font-bold text-slate-700 text-sm ml-1">2. ค่าไฟเฉลี่ยต่อเดือน (บาท):</label>
                                    <div className="relative">
                                        <input type="number" value={bill} onChange={(e) => setBill(e.target.value)}
                                            className="w-full p-4 text-3xl font-black border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none bg-slate-50" />
                                        <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-black text-xl">฿</span>
                                    </div>
                                </div>

                                {/* เพิ่มแถบสไลด์ปรับพฤติกรรม */}
                                <div className="md:col-span-2 space-y-3 mt-4 p-5 bg-slate-50 rounded-3xl border border-slate-100">
                                    <label className="block font-bold text-slate-700 text-sm flex justify-between items-center">
                                        <span>3. พฤติกรรมการใช้ไฟกลางวัน (08:00 - 17:00 น.)</span>
                                        <span className="text-blue-700 text-2xl font-black">{dayUsage}%</span>
                                    </label>
                                    <input type="range" min="10" max="100" step="5" value={dayUsage} onChange={(e) => setDayUsage(e.target.value)}
                                        className="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                    <div className="flex justify-between text-[10px] text-slate-400 font-bold px-1 uppercase tracking-wider">
                                        <span>เน้นคืน (Night)</span>
                                        <span>เน้นวัน (Daylife)</span>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                                <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100 shadow-inner">
                                    <p className="text-xs font-bold text-blue-600 uppercase mb-2 tracking-widest">ขนาดที่แนะนำจริง</p>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-6xl font-black text-blue-900">{solarSize}</span>
                                        <span className="text-xl font-bold text-blue-700 uppercase">kWp</span>
                                    </div>
                                </div>
                                <div className="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 shadow-inner">
                                    <p className="text-xs font-bold text-emerald-600 uppercase mb-2 tracking-widest">ประหยัดเฉลี่ย</p>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-6xl font-black text-emerald-900">{Number(estSaving).toLocaleString()}</span>
                                        <span className="text-xl font-bold text-emerald-700 uppercase">บาท/ด.</span>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-8 border-t border-slate-100">
                                <h3 className="text-xl font-black text-slate-800 mb-6 text-center uppercase tracking-widest">จุดคุ้มทุนรายปี (25 ปี)</h3>
                                <SolarChart savingYearly={estSaving * 12} investment={estInvestment} />
                                
                                <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Payback Period</p>
                                        <p className="text-orange-600 text-4xl font-black">{(estInvestment / (estSaving * 12)).toFixed(1)} <span className="text-lg text-slate-500">ปี</span></p>
                                    </div>
                                    <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">ประหยัดรวมสุทธิ 25 ปี</p>
                                        <p className="text-emerald-800 text-4xl font-black">
                                            {Number((estSaving * 12 * (1 - Math.pow(0.995, 25)) / 0.005)).toLocaleString(undefined, {maximumFractionDigits: 0})} <span className="text-lg text-slate-500">฿</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>
                        
                        <div className="text-[11px] text-slate-400 px-8 mb-12 italic leading-relaxed text-center">
                            *การวิเคราะห์คำนวณจากหน่วยไฟที่ใช้ช่วงกลางวันจริง เพื่อลดโอกาสการเกิดไฟฟ้าเหลือทิ้ง (Export) และเพิ่มความคุ้มค่าสูงสุดแก่ผู้ใช้
                        </div>
                    </main>

                    {showModal && !isRegistered && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-[2.5rem] p-8 md:p-12 max-w-md w-full shadow-2xl text-center border border-slate-100">
                                <div className="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-8">
                                    <svg className="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <h3 className="text-2xl font-black mb-2 text-slate-800">ยืนยันเพื่อเข้าสู่รายงาน</h3>
                                <p className="text-slate-500 text-sm mb-10 leading-relaxed font-medium">ระบุข้อมูลของคุณเพื่อรับผลวิเคราะห์<br/>Energy Behavior ROI Analysis</p>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <input required type="text" placeholder="ชื่อ-นามสกุล ของคุณ" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                    <input required type="tel" placeholder="เบอร์โทรศัพท์ติดต่อ" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.tel} onChange={(e) => setFormData({...formData, tel: e.target.value})} />
                                    <button disabled={isLoading} className={`w-full ${isLoading ? 'bg-slate-400' : 'bg-blue-700 hover:bg-blue-800'} text-white font-black py-5 rounded-2xl mt-6 shadow-xl active:scale-95 transition-all text-lg`}>
                                        {isLoading ? 'กำลังวิเคราะห์...' : 'เข้าสู่หน้าคำนวณ'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
