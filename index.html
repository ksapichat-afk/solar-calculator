<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar ROI Expert Calculator - SolarHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVH0o1BUu39kVifgr7pP_vBJ51VPeVaLCAEb84HzduMiLB3D654-orIFFhg4fMHjq57Q/exec"; 

        const PROVINCE_SUN_HOURS = {
            "กรุงเทพมหานคร": 4.01, "เชียงใหม่": 3.85, "ขอนแก่น": 4.22, "นครราชสีมา": 4.35,
            "ชลบุรี": 4.12, "ภูเก็ต": 3.95, "สงขลา": 3.80, "สุราษฎร์ธานี": 3.90,
            "นนทบุรี": 4.01, "ปทุมธานี": 4.05, "สมุทรปราการ": 4.00, "ระยอง": 4.10,
            "นครปฐม": 4.10, "พิษณุโลก": 4.15, "อุดรธานี": 4.20
        };

        const SolarChart = ({ savingYearly, investment }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();

                const labels = Array.from({length: 25}, (_, i) => `ปีที่ ${i+1}`);
                let cumulativeSaving = 0;
                const dataSaving = labels.map((_, i) => {
                    cumulativeSaving += savingYearly * Math.pow(0.995, i);
                    return cumulativeSaving.toFixed(0);
                });

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'กำไรสะสม (บาท)',
                                data: dataSaving,
                                backgroundColor: 'rgba(16, 185, 129, 0.6)',
                                borderColor: '#10b981',
                                borderWidth: 1,
                                order: 2
                            },
                            {
                                label: 'เงินลงทุน (บาท)',
                                data: Array(25).fill(investment),
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [5, 5],
                                type: 'line',
                                fill: false,
                                pointRadius: 0,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { callback: (value) => value.toLocaleString() + ' บ.' }
                            }
                        }
                    }
                });
            }, [savingYearly, investment]);

            return <div className="h-64 w-full mt-4"><canvas ref={canvasRef}></canvas></div>;
        };

        const App = () => {
            const [bill, setBill] = useState(5000);
            const [province, setProvince] = useState("กรุงเทพมหานคร");
            const [isRegistered, setIsRegistered] = useState(false);
            const [showModal, setShowModal] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', tel: '' });

            const sunHours = PROVINCE_SUN_HOURS[province] || 4.0;
            const elecRate = 4.2;

            const solarSize = useMemo(() => (bill / elecRate / 30 / sunHours).toFixed(2), [bill, sunHours]);
            
            // Dynamic Investment based on Economy of Scale
            const estInvestment = useMemo(() => {
                const size = parseFloat(solarSize);
                let pricePerKWp = 45000;
                if (size >= 3 && size < 5) pricePerKWp = 42000;
                else if (size >= 5 && size < 10) pricePerKWp = 38000;
                else if (size >= 10 && size < 20) pricePerKWp = 32000;
                else if (size >= 20) pricePerKWp = 28000;
                return (size * pricePerKWp).toFixed(0);
            }, [solarSize]);

            const estSaving = useMemo(() => {
                const saving = solarSize * sunHours * 30 * elecRate;
                return (saving * 0.995).toFixed(0); // 1st year with 0.5% degradation
            }, [solarSize, sunHours]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            name: formData.name,
                            message: formData.tel,
                            province: province,
                            email: "Solar-Expert-V3"
                        }),
                        mode: 'no-cors' 
                    });
                    setIsRegistered(true);
                    setShowModal(false);
                } catch (error) {
                    setIsRegistered(true);
                    setShowModal(false);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-blue-800 p-5 text-white shadow-xl">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold tracking-tight">SolarHub Expert ROI</h1>
                            <span className="text-xs bg-blue-600 px-2 py-1 rounded font-bold uppercase tracking-widest">Official V3.0</span>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-8 w-full flex-grow">
                        <section className="bg-white rounded-3xl shadow-2xl p-6 md:p-10 mb-8 border border-slate-100 animate-fade-in">
                            <div className="text-center mb-10">
                                <h2 className="text-3xl font-black text-slate-800 mb-2">วิเคราะห์ผลตอบแทนการลงทุน</h2>
                                <p className="text-slate-500 text-sm">แม่นยำด้วยสถิติแดนรายจังหวัดและ Economy of Scale</p>
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-8 mb-10">
                                <div className="space-y-2">
                                    <label className="block font-bold text-slate-700 text-sm ml-1">1. จังหวัดที่ติดตั้ง:</label>
                                    <select 
                                        value={province} 
                                        onChange={(e) => setProvince(e.target.value)}
                                        className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none transition-all cursor-pointer font-bold text-lg"
                                    >
                                        {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => (
                                            <option key={p} value={p}>{p}</option>
                                        ))}
                                    </select>
                                    <p className="text-[11px] text-blue-600 font-bold ml-1 italic underline">สถิติความเข้มแดด {sunHours} ชม./วัน</p>
                                </div>

                                <div className="space-y-2">
                                    <label className="block font-bold text-slate-700 text-sm ml-1">2. ค่าไฟเฉลี่ยต่อเดือน (บาท):</label>
                                    <div className="relative">
                                        <input 
                                            type="number" 
                                            value={bill} 
                                            onChange={(e) => setBill(e.target.value)}
                                            className="w-full p-4 text-3xl font-black border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none bg-slate-50"
                                        />
                                        <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-black text-xl">฿</span>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                                <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10">
                                        <svg className="w-16 h-16" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clipRule="evenodd"></path></svg>
                                    </div>
                                    <p className="text-xs font-bold text-blue-600 uppercase mb-2 tracking-widest">ขนาดที่แนะนำ</p>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-6xl font-black text-blue-900">{solarSize}</span>
                                        <span className="text-xl font-bold text-blue-700 uppercase">kWp</span>
                                    </div>
                                </div>

                                <div className="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10">
                                        <svg className="w-16 h-16" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd"></path></svg>
                                    </div>
                                    <p className="text-xs font-bold text-emerald-600 uppercase mb-2 tracking-widest">ประหยัดเฉลี่ย</p>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-6xl font-black text-emerald-900">{Number(estSaving).toLocaleString()}</span>
                                        <span className="text-xl font-bold text-emerald-700 uppercase">บาท/ด.</span>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-8 border-t border-slate-100">
                                <h3 className="text-xl font-black text-slate-800 mb-6 text-center uppercase tracking-wide">วิเคราะห์จุดคุ้มทุนเชิงลึก (25 ปี)</h3>
                                <SolarChart savingYearly={estSaving * 12} investment={estInvestment} />
                                
                                <div className="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Payback Period</p>
                                        <p className="text-orange-600 text-4xl font-black">{(estInvestment / (estSaving * 12)).toFixed(1)} <span className="text-lg">ปี</span></p>
                                    </div>
                                    <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100 text-center">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-2">Total Saving (25Y)</p>
                                        <p className="text-emerald-800 text-4xl font-black">
                                            {Number((estSaving * 12 * (1 - Math.pow(0.995, 25)) / (1 - 0.005))).toLocaleString()} <span className="text-lg">฿</span>
                                        </p>
                                    </div>
                                </div>

                                {/* SECTION: หมายเหตุและแหล่งอ้างอิง */}
                                <div className="mt-10 p-6 bg-slate-50 rounded-2xl border-l-4 border-blue-500">
                                    <h4 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                                        <svg className="w-4 h-4 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd"></path></svg>
                                        หมายเหตุและแหล่งอ้างอิงทางวิศวกรรม
                                    </h4>
                                    <ul className="text-[11px] text-slate-500 space-y-2 leading-relaxed list-disc ml-4">
                                        <li><strong>ราคาติดตั้ง (Investment):</strong> อ้างอิงราคากลางปี 2569 สำหรับแผง Tier 1 และ Inverter มาตรฐานสากล โดยใช้ระบบ <strong>Economy of Scale</strong> (ราคาต่อ kWp ลดลงเมื่อขนาดติดตั้งใหญ่ขึ้น) ครอบคลุมค่าอุปกรณ์ ค่าแรง และการดำเนินการขออนุญาต</li>
                                        <li><strong>การคำนวณรายได้ (Savings):</strong> อ้างอิงอัตราค่าไฟฟ้าคงที่ 4.2 บาท/หน่วย และค่าความเข้มแสงแดด (Specific Yield) รายจังหวัดตามฐานข้อมูลพิกัดดาวเทียมทางพลังงาน</li>
                                        <li><strong>ค่าเสื่อมประสิทธิภาพ (Degradation):</strong> คำนวณการลดลงของประสิทธิภาพแผง 0.5% ต่อปี ตามมาตรฐานการรับประกันวัสดุ 25 ปี</li>
                                        <li><strong>สิทธิประโยชน์ทางภาษี:</strong> การคำนวณนี้ยังไม่ได้รวมการหักลดหย่อนภาษีเงินได้บุคคลธรรมดา (สูงสุด 200,000 บาท) ซึ่งจะช่วยให้คืนทุนเร็วกว่าที่แสดงในกราฟ</li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <div className="bg-slate-900 rounded-3xl p-8 text-white flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl mb-12">
                            <div className="text-center md:text-left">
                                <h4 className="font-bold text-xl mb-1 text-blue-400">สนใจติดตั้งหรือรับคำปรึกษาฟรี?</h4>
                                <p className="text-slate-400 text-sm">ทีมวิศวกรผู้เชี่ยวชาญพร้อมประเมินหน้างานจริงทั่วประเทศ</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                                <a 
                                    href="https://line.me/R/ti/p/~apichatkongsuk" 
                                    target="_blank"
                                    className="bg-[#06C755] hover:bg-[#05a346] text-white font-black py-4 px-8 rounded-2xl transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2 text-lg"
                                >
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" className="w-5 h-5" />
                                    ปรึกษาทาง LINE
                                </a>
                            </div>
                        </div>
                    </main>

                    {showModal && !isRegistered && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-[2.5rem] p-8 md:p-12 max-w-md w-full shadow-2xl text-center border border-slate-100 animate-fade-in">
                                <div className="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-8 border border-blue-100">
                                    <svg className="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <h3 className="text-2xl font-black mb-2 text-slate-800">เริ่มการวิเคราะห์เชิงลึก</h3>
                                <p className="text-slate-500 text-sm mb-10">กรุณาระบุข้อมูลเพื่อเข้าสู่ระบบคำนวณ<br/>Solar Expert ROI (Official)</p>
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="text-left">
                                        <label className="text-[10px] font-bold text-slate-400 ml-3 mb-1 block uppercase tracking-[0.2em]">Installation Province</label>
                                        <select 
                                            value={province} 
                                            onChange={(e) => setProvince(e.target.value)}
                                            className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 cursor-pointer transition-all"
                                        >
                                            {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => (
                                                <option key={p} value={p}>{p}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <input required type="text" placeholder="ชื่อ-นามสกุล ของคุณ" 
                                        className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                    <input required type="tel" placeholder="เบอร์โทรศัพท์ติดต่อ" 
                                        className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium"
                                        value={formData.tel} onChange={(e) => setFormData({...formData, tel: e.target.value})} />
                                    <button disabled={isLoading}
                                        className={`w-full ${isLoading ? 'bg-slate-400' : 'bg-blue-700 hover:bg-blue-800'} text-white font-black py-5 rounded-2xl mt-6 shadow-xl active:scale-95 transition-all text-lg`}>
                                        {isLoading ? 'กำลังประมวลผลข้อมูล...' : 'ดูผลการวิเคราะห์'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
