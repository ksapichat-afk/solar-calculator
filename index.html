<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYE Solar ROI Expert Master - V6.7.8 (Official Production)</title>
    <!-- 🏆 ชุดสคริปต์เสถียรสูงล็อกเวอร์ชัน V6.7.8 ป้องกันหน้าจอขาวถาวร 100% -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @media screen {
            .print-layout { position: absolute; left: -9999px; top: -9999px; width: 210mm; }
            .screen-layout { display: block; }
        }
        @media print {
            @page { size: A4; margin: 0; }
            .no-print { display: none !important; }
            .screen-layout { display: none !important; }
            .print-layout { position: static; display: block; width: 100% !important; max-width: 100% !important; background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            .a4-sheet { width: 100% !important; min-height: 100% !important; padding: 12mm !important; margin: 0 !important; box-shadow: none !important; page-break-after: always; break-after: page; background: #ffffff !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // 📦 ฐานข้อมูลแพ็กเกจมาตรฐานของบริษัทในเวอร์ชัน V6.7.8 (คงไว้ครบถ้วนไม่สูญหาย)
        const SOLAR_PACKAGES = {
            ongrid: {
                "1": [
                    { name: "On-Grid Solis 3kW 1P", maxSize: 3.5, kwpSize: 3.3, price: 89000, panels: 6, area: 18 },
                    { name: "On-Grid Solis 5kW 1P", maxSize: 5.5, kwpSize: 5.5, price: 135000, panels: 10, area: 30 },
                    { name: "On-Grid Solis 10kW 1P", maxSize: 100.0, kwpSize: 9.9, price: 215000, panels: 18, area: 54 }
                ],
                "3": [
                    { name: "On-Grid Solis 5kW 3P", maxSize: 5.5, kwpSize: 3.3, price: 149000, panels: 6, area: 18 },
                    { name: "On-Grid Solis 10kW 3P", maxSize: 10.5, kwpSize: 9.9, price: 239000, panels: 18, area: 54 },
                    { name: "On-Grid Solis 20kW 3P", maxSize: 25.0, kwpSize: 15.4, price: 409000, panels: 28, area: 84 },
                    { name: "On-Grid Solis 30kW 3P", maxSize: 100.0, kwpSize: 23.1, price: 549000, panels: 42, area: 126 }
                ]
            },
            hybrid: {
                "1": [
                    { name: "Hybrid Deye 5kW 1P", maxSize: 5.2, kwpSize: 5.5, price: 159000, panels: 10, area: 30 },
                    { name: "Hybrid Deye 6kW 1P", maxSize: 6.2, kwpSize: 5.5, price: 159000, panels: 10, area: 30 },
                    { name: "Hybrid Solis 6kW 1P", maxSize: 7.0, kwpSize: 5.5, price: 165122, panels: 10, area: 30 },
                    { name: "Hybrid Solis 8kW 1P", maxSize: 8.5, kwpSize: 7.15, price: 216226, panels: 13, area: 39 },
                    { name: "Hybrid Deye 10kW 1P", maxSize: 10.2, kwpSize: 9.9, price: 259000, panels: 18, area: 54 },
                    { name: "Hybrid Solis 10kW 1P", maxSize: 12.0, kwpSize: 9.9, price: 269897, panels: 18, area: 54 },
                    { name: "Hybrid Deye 15kW 1P", maxSize: 15.5, kwpSize: 11.0, price: 349000, panels: 20, area: 60 },
                    { name: "Hybrid Solis 16kW 1P", maxSize: 100.0, kwpSize: 12.1, price: 350917, panels: 22, area: 66 }
                ],
                "3": [
                    { name: "Hybrid Deye 5kW 3P", maxSize: 5.5, kwpSize: 5.5, price: 189000, panels: 10, area: 30 },
                    { name: "Hybrid Solis 10kW 3P", maxSize: 10.2, kwpSize: 8.8, price: 254104, panels: 16, area: 48 },
                    { name: "Hybrid Deye 10kW 3P", maxSize: 11.5, kwpSize: 9.9, price: 289000, panels: 18, area: 54 },
                    { name: "Hybrid Deye 12kW 3P", maxSize: 13.5, kwpSize: 12.1, price: 299000, panels: 22, area: 66 },
                    { name: "Hybrid Deye 15kW 3P", maxSize: 16.0, kwpSize: 11.0, price: 319000, panels: 20, area: 60 },
                    { name: "Hybrid Solis 20kW 3P", maxSize: 22.0, kwpSize: 15.4, price: 406129, panels: 28, area: 84 },
                    { name: "Hybrid Deye 20kW 3P", maxSize: 26.0, kwpSize: 15.4, price: 449000, panels: 28, area: 84 },
                    { name: "Hybrid Deye 30kW 3P", maxSize: 45.0, kwpSize: 13.2, price: 649000, panels: 24, area: 72 },
                    { name: "Hybrid Solis 50kW 3P", maxSize: 100.0, kwpSize: 37.95, price: 955296, panels: 69, area: 207 }
                ]
            }
        };

        const BATTERY_OPTIONS = {
            "Deye (ประกัน 10ปี)": [
                { cap: "5.12 kWh", price: 33000 },
                { cap: "10.00 kWh", price: 61000 },
                { cap: "16.00 kWh", price: 84000 }
            ],
            "SigenStore Premium": [
                { cap: "9.04 kWh", price: 95000 },
                { cap: "18.08 kWh", price: 180000 }
            ]
        };

        const PROVINCE_SUN_HOURS = {
            "ระยอง": 4.10, "กรุงเทพมหานคร": 4.01, "ชลบุรี": 4.12, "นนทบุรี": 4.01, "ปทุมธานี": 4.05, "สมุทรปราการ": 4.00,
            "พระนครศรีอยุธยา": 4.12, "นครปฐม": 4.10, "สมุทรสาคร": 4.05, "เชียงใหม่": 3.85, "ขอนแก่น": 4.22, "ภูเก็ต": 3.95
        };

        const App = () => {
            const [bill, setBill] = useState(6000);
            const [province, setProvince] = useState("กรุงเทพมหานคร");
            const [tariffType, setTariffType] = useState("normal"); 
            const [systemType, setSystemType] = useState("ongrid"); 
            
            const [dayUsage, setDayUsage] = useState(70);      
            const [eveningUsage, setEveningUsage] = useState(20);  
            const [nightUsage, setNightUsage] = useState(10);    

            const [phase, setPhase] = useState("1");
            const [batteryBrand, setBatteryBrand] = useState("Deye (ประกัน 10ปี)");
            const [batteryIndex, setBatteryIndex] = useState(0);

            const [formData, setFormData] = useState({ name: '', tel: '-' });
            const [address, setAddress] = useState("");

            // ✏️ จุดควบคุมแมนนวลที่เพิ่มเข้าสู่ระบบ V6.7.8 Production
            const [isManualPrice, setIsManualPrice] = useState(false);
            const [manualPriceInput, setManualPriceInput] = useState("");

            const canvasRef1 = useRef(null);
            const canvasRef2 = useRef(null);
            const chart1 = useRef(null);
            const chart2 = useRef(null);

            const sunHours = useMemo(() => PROVINCE_SUN_HOURS[province] || 4.0, [province]);

            const rates = useMemo(() => {
                if (tariffType === "tou") {
                    const avgRate = ((dayUsage * 5.8) + (eveningUsage * 5.8) + (nightUsage * 2.6)) / 100;
                    return { day: 5.8, evening: 5.8, night: 2.6, avg: avgRate };
                }
                return { day: 4.2, evening: 4.2, night: 4.2, avg: 4.2 };
            }, [tariffType, dayUsage, eveningUsage, nightUsage]);

            const solarSize = useMemo(() => {
                const totalUnitsPerMonth = bill / rates.avg;
                const unitsNeededPerDay = totalUnitsPerMonth / 30;
                const factor = systemType === "hybrid" ? (dayUsage + (eveningUsage * 0.7)) / 100 : dayUsage / 100;
                return ((unitsNeededPerDay * factor) / sunHours).toFixed(2);
            }, [bill, sunHours, dayUsage, eveningUsage, systemType, rates.avg]);

            const matchedPackage = useMemo(() => {
                const size = parseFloat(solarSize) || 0;
                const packages = SOLAR_PACKAGES[systemType]?.[phase] || [];
                let selected = packages.find(p => size <= p.maxSize);
                return selected || packages[packages.length - 1];
            }, [solarSize, systemType, phase]);

            const estBatteryCost = useMemo(() => {
                if (systemType !== "hybrid") return 0;
                return BATTERY_OPTIONS[batteryBrand]?.[batteryIndex]?.price || 0;
            }, [systemType, batteryBrand, batteryIndex]);

            // 🎯 กลไกสลับราคา: ติ๊กเลือกแมนนวลจะข้ามราคาระบบและดีดกราฟ/ตารางใหม่ทันที
            const estInvestment = useMemo(() => {
                if (isManualPrice) {
                    return parseFloat(manualPriceInput) || 0;
                }
                if (!matchedPackage) return 0;
                return matchedPackage.price + estBatteryCost;
            }, [isManualPrice, manualPriceInput, matchedPackage, estBatteryCost]);

            const estSaving = useMemo(() => {
                if (!matchedPackage) return 0;
                const totalUnitsMonth = bill / rates.avg;
                const dayUnitsMonth = totalUnitsMonth * (dayUsage / 100);
                const maxPackageDayProduction = matchedPackage.kwpSize * sunHours * 30; 
                const daySavings = Math.min(dayUnitsMonth, maxPackageDayProduction) * rates.day;
                
                let eveningSavings = 0;
                if (systemType === "hybrid") {
                    const battCapStr = BATTERY_OPTIONS[batteryBrand]?.[batteryIndex]?.cap || "0";
                    const battCapacity = parseFloat(battCapStr) || 0;
                    const maxBatteryOutputPerMonth = battCapacity * 0.8 * 30; 
                    const eveningUnitsPerMonth = totalUnitsMonth * (eveningUsage / 100);
                    eveningSavings = Math.min(eveningUnitsPerMonth, maxBatteryOutputPerMonth) * rates.evening;
                }
                return (daySavings + eveningSavings).toFixed(0);
            }, [matchedPackage, sunHours, dayUsage, eveningUsage, bill, systemType, batteryBrand, batteryIndex, rates]);

            const cashFlowData = useMemo(() => {
                const years = Array.from({length: 25}, (_, i) => i + 1);
                let cumulative = 0;
                return years.map(year => {
                    const yearlySaving = estSaving * 12 * Math.pow(0.995, year - 1);
                    cumulative += yearlySaving;
                    return { year, yearlySaving, cumulative, netProfit: cumulative - estInvestment };
                });
            }, [estSaving, estInvestment]);

            const paybackPeriodStr = (estInvestment / (estSaving * 12 || 1)).toFixed(1);
            const netLifetimeProfitStr = Math.round(estSaving * 12 * (1 - Math.pow(0.995, 25)) / 0.005).toLocaleString();

            useEffect(() => {
                const buildChart = (canvasRef, chartRefRef, isPrintSize) => {
                    if (!canvasRef.current) return;
                    const ctx = canvasRef.current.getContext('2d');
                    if (chartRefRef.current) chartRefRef.current.destroy();

                    const labels = Array.from({length: 25}, (_, i) => "ปีที่ " + (i + 1));
                    let cumulativeSaving = 0;
                    const dataSaving = labels.map((_, i) => {
                        cumulativeSaving += estSaving * 12 * Math.pow(0.995, i);
                        return Math.round(cumulativeSaving);
                    });

                    chartRefRef.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'ประหยัดสะสม (บาท)', data: dataSaving, backgroundColor: 'rgba(30, 58, 138, 0.6)', borderColor: '#1e3a8a', borderWidth: 1, order: 2 },
                                { label: 'เงินลงทุนโครงการ (บาท)', data: Array(25).fill(estInvestment), borderColor: '#ef4444', borderWidth: 2, borderDash: [5, 5], type: 'line', fill: false, pointRadius: 0, order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: { padding: { right: isPrintSize ? 35 : 10, left: 10, top: isPrintSize ? 15 : 5, bottom: isPrintSize ? 15 : 5 } },
                            plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 10 } } } },
                            scales: {
                                y: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: isPrintSize ? 8 : 9 }, callback: (v) => v.toLocaleString() + ' บ.' } },
                                x: { ticks: { font: { family: 'Sarabun', size: isPrintSize ? 7.5 : 9 }, autoSkip: false } }
                            }
                        }
                    });
                };
                buildChart(canvasRef1, chart1, false);
                buildChart(canvasRef2, chart2, true);
            }, [estSaving, estInvestment]);

            const handlePercentageChange = (type, val) => {
                const num = Math.min(100, Math.max(0, Number(val)));
                if (type === 'day') {
                    setDayUsage(num);
                    if (num + eveningUsage > 100) { setEveningUsage(100 - num); setNightUsage(0); }
                    else { setNightUsage(100 - num - eveningUsage); }
                } else if (type === 'evening') {
                    if (dayUsage + num > 100) { setEveningUsage(100 - dayUsage); setNightUsage(0); }
                    else { setEveningUsage(num); setNightUsage(100 - dayUsage - num); }
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* ⚙️ หน้าต่าง Screen UI แดชบอร์ดหลัก V6.7.8 */}
                    <div className="screen-layout no-print">
                        <header className="bg-slate-900 p-4 text-white shadow-xl flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <img src="https://img1.pic.in.th/images/TYE-Solar.jpg" className="h-8 w-auto rounded-lg bg-white p-0.5" alt="TYE Logo" />
                                <h1 className="text-sm md:text-lg font-bold">⭐ TYE SOLARMASTER V6.7.8 (Production Version)</h1>
                            </div>
                            <button type="button" onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white font-black py-2 px-4 rounded-xl text-xs shadow-md">🖨️ สั่งพิมพ์เล่มรายงาน</button>
                        </header>

                        <main className="max-w-4xl mx-auto p-4 md:p-8 w-full text-slate-800">
                            <section className="bg-white rounded-[2rem] shadow-2xl p-6 md:p-10 mb-8 border border-slate-100 animate-fade-in">
                                <div className="grid md:grid-cols-2 gap-4 mb-6">
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">👤 ชื่อลูกค้า:</label>
                                        <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold" placeholder="ระบุชื่อลูกค้า" />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">📍 ที่อยู่ติดตั้งหน้างาน:</label>
                                        <input type="text" value={address} onChange={(e) => setAddress(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold" placeholder="ระบุที่อยู่หน้างาน" />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">จังหวัด:</label>
                                        <select value={province} onChange={(e) => setProvince(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold">
                                            {Object.keys(PROVINCE_SUN_HOURS).map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">ค่าไฟเฉลี่ยต่อเดือน (บาท):</label>
                                        <input type="number" value={bill} onChange={(e) => setBill(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-black text-lg text-blue-900" />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">ประเภทระบบ:</label>
                                        <select value={systemType} onChange={(e) => setSystemType(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold">
                                            <option value="ongrid">☀️ On-Grid System</option>
                                            <option value="hybrid">🔋 Hybrid System</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">ประเภทมิเตอร์:</label>
                                        <select value={tariffType} onChange={(e) => setTariffType(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold">
                                            <option value="normal">ปกติ (Flat Rate)</option>
                                            <option value="tou">TOU (On/Off-Peak)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 text-xs block mb-1">ระบบไฟฟ้าหน้างาน:</label>
                                        <select value={phase} onChange={(e) => setPhase(e.target.value)} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold">
                                            <option value="1">1 Phase</option>
                                            <option value="3">3 Phase</option>
                                        </select>
                                    </div>
                                    
                                    {systemType === "hybrid" && (
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="font-bold text-slate-700 text-xs block mb-1">แบรนด์แบต:</label>
                                                <select value={batteryBrand} onChange={(e) => { setBatteryBrand(e.target.value); setBatteryIndex(0); }} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold text-xs">
                                                    {Object.keys(BATTERY_OPTIONS).map(b => <option key={b} value={b}>{b}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 text-xs block mb-1">ขนาดความจุ:</label>
                                                <select value={batteryIndex} onChange={(e) => setBatteryIndex(Number(e.target.value))} className="w-full p-3.5 bg-slate-50 border rounded-xl outline-none font-bold text-xs">
                                                    {(BATTERY_OPTIONS[batteryBrand] || []).map((opt, idx) => <option key={idx} value={idx}>{opt.cap}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="p-4 bg-slate-50 border rounded-2xl space-y-3 mb-6">
                                    <div className="flex justify-between text-xs font-bold"><span>☀️ กลางวัน: {dayUsage}%</span> <span>🌆 ค่ำ: {eveningUsage}%</span> <span>🌙 ดึก: {nightUsage}%</span></div>
                                    <input type="range" min="0" max="100" value={dayUsage} onChange={(e) => handlePercentageChange('day', e.target.value)} className="w-full accent-blue-600" />
                                    <input type="range" min="0" max="100" value={eveningUsage} onChange={(e) => handlePercentageChange('evening', e.target.value)} className="w-full accent-orange-500" />
                                </div>

                                {/* ✏️ เครื่องมือเพิ่มความยืดหยุ่นให้ทีมเซลล์: ระบุราคาสุทธิเองก้อนเดียวจบ */}
                                <div className="p-4 bg-blue-50/50 border-2 border-blue-100 rounded-2xl mb-6">
                                    <div className="flex items-center gap-2 mb-2">
                                        <input type="checkbox" id="mPrice" checked={isManualPrice} onChange={(e) => setIsManualPrice(e.target.checked)} className="cursor-pointer" />
                                        <label htmlFor="mPrice" className="text-xs font-black text-blue-900 cursor-pointer">✏️ ต้องการพิมพ์ระบุยอดราคาลงทุนสุทธิเอง (Manual Net Price Override)</label>
                                    </div>
                                    {isManualPrice && (
                                        <input type="number" value={manualPriceInput} onChange={(e) => setManualPriceInput(e.target.value)} className="w-full p-3 bg-white border border-blue-200 rounded-xl outline-none font-black text-base text-blue-950" placeholder="ระบุราคาสุทธิใบเสนอราคา เช่น 771897.87" />
                                    )}
                                </div>

                                {matchedPackage && (
                                    <div className="p-5 bg-slate-900 text-white rounded-2xl mb-6 text-sm font-semibold">
                                        <div className="flex justify-between"><span>ระบบแนะนำอัตโนมัติ:</span> <span>{matchedPackage.name}</span></div>
                                        <div className="flex justify-between border-t border-slate-700 pt-2 mt-2 font-black">
                                            <span>💰 ทุนรวมโครงการสุทธิ:</span>
                                            <span className="text-emerald-400 text-xl">{Number(estInvestment).toLocaleString()} บาท</span>
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-4 mb-6 text-center font-black">
                                    <div className="bg-slate-50 p-4 border rounded-xl">
                                        <p className="text-xs text-slate-400">ขนาดแนะนำ</p>
                                        <p className="text-2xl text-slate-800">{solarSize} kWp</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 border rounded-xl">
                                        <p className="text-xs text-emerald-600">ประหยัดเฉลี่ย/เดือน</p>
                                        <p className="text-2xl text-emerald-600">{Number(estSaving).toLocaleString()} บ.</p>
                                    </div>
                                </div>

                                <div className="h-64 w-full relative">
                                    <canvas ref={canvasRef1}></canvas>
                                </div>
                            </section>
                        </main>
                    </div>

                    {/* ========================================================================
                        📄 ส่วนเล่มรายงานสำหรับพิมพ์โครงสร้าง V6.7.8 กราฟขนาด h-[62mm] พอดีแผ่นเป๊ะ
                        ======================================================================== */}
                    <div className="print-layout bg-white p-0">
                        {/* 📄 แผ่นพิมพ์ที่ 1 */}
                        <div className="a4-sheet flex flex-col justify-between">
                            <div>
                                <div className="bg-orange-100 border border-orange-200 rounded-2xl p-4 mb-4 shadow-sm text-center">
                                    <img src="https://img1.pic.in.th/images/TYE-Solar.jpg" className="h-9 w-auto mx-auto object-contain mix-blend-multiply mb-1" alt="TYE Logo" />
                                    <h2 className="text-sm font-black text-slate-900">รายงานวิเคราะห์ผลประโยชน์การลงทุนระบบพลังงานแสงอาทิตย์</h2>
                                    <p className="text-[8px] text-slate-500 font-bold uppercase">TECHNICAL FINANCING INVESTMENT PROPOSAL — OFFICIAL DOCUMENT</p>
                                </div>

                                <div className="mb-4">
                                    <h3 className="text-xs font-black mb-1.5 border-l-4 border-slate-900 pl-2">1. รายละเอียดข้อมูลลูกค้าคู่สัญญาและพารามิเตอร์ฐาน</h3>
                                    <div className="grid grid-cols-2 bg-slate-50 border rounded-xl p-3 text-[11px] font-bold text-slate-700 gap-y-1">
                                        <div>ชื่อลูกค้า: <span className="text-slate-950 font-black">{formData.name || '-'}</span></div>
                                        <div>สถานที่ติดตั้ง: <span className="text-slate-950 font-black">{address || '-'}</span></div>
                                        <div>ฐานค่าไฟเดิม: <span className="text-slate-950 font-black">{Number(bill).toLocaleString()} บ./เดือน</span></div>
                                        <div>ประเภทระบบ: <span className="text-slate-950 font-black uppercase">{systemType} ({phase} Phase)</span></div>
                                        <div>มิเตอร์ไฟฟ้า: <span className="text-slate-950 font-black uppercase">{tariffType}</span></div>
                                        <div>สัดส่วนใช้ไฟ: <span className="text-slate-950 font-black">กลางวัน {dayUsage}% / ค่ำ {eveningUsage}% / ดึก {nightUsage}%</span></div>
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <h3 className="text-xs font-black mb-1.5 border-l-4 border-slate-900 pl-2">2. ขนาดกำลังการผลิตติดตั้งระบบวิศวกรรมควบคุม</h3>
                                    <div className="bg-blue-50 border rounded-xl p-3 flex justify-between items-center text-xs font-bold text-blue-950">
                                        <span>ขนาดกำลังติดตั้งแผงโซล่าเซลล์ที่คำนวณได้คุ้มค่าทางเศรษฐศาสตร์</span>
                                        <span className="text-base font-black text-slate-900">{matchedPackage ? matchedPackage.kwpSize : solarSize} kWp</span>
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <h3 className="text-xs font-black mb-1.5 border-l-4 border-slate-900 pl-2">3. สรุปงบเงินลงทุนรวมทั้งโครงการ</h3>
                                    <div className="border rounded-xl p-3 text-[11px] font-bold space-y-1.5 bg-white">
                                        <div className="flex justify-between"><span>ชุดระบบหลักพร้อมติดตั้ง:</span> <span>{matchedPackage ? matchedPackage.name : '-'}</span></div>
                                        {systemType === "hybrid" && (
                                            <div className="flex justify-between text-blue-900 border-t pt-1">
                                                <span>ระบบแบตเตอรี่สำรอง:</span> <span>{batteryBrand} ({BATTERY_OPTIONS[batteryBrand]?.[batteryIndex]?.cap})</span>
                                            </div>
                                        )}
                                        <div className="border-t border-dashed border-slate-300 pt-2 flex justify-between items-baseline text-slate-900 font-black text-xs">
                                            <span>💰 ยอดรวมเงินลงทุนโครงการสุทธิ (รวม VAT เรียบร้อย):</span>
                                            <span className="text-emerald-600 text-base">{Number(estInvestment).toLocaleString(undefined, {maximumFractionDigits:2})} บาท</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border p-2 rounded-xl">
                                    <p className="text-[8px] font-black text-slate-500 text-center mb-0.5">แผนภูมิประเมินผลประหยัดสะสมต่อเนื่องเทียบทุนโครงการ 25 ปี</p>
                                    <div className="h-[62mm] w-[172mm] mx-auto relative">
                                        <canvas ref={canvasRef2}></canvas>
                                    </div>
                                </div>
                            </div>
                            <div className="text-center border-t pt-1.5 text-[8px] font-black text-slate-400 uppercase">
                                บริษัท ธันยธรณ์ เอ็นจิเนียริ่ง แอนด์ ดีเวลลอปเม้นท์ จํากัด | หน้า 1
                            </div>
                        </div>

                        {/* 📄 หน้าพิมพ์ที่ 2 */}
                        <div className="a4-sheet flex flex-col justify-between">
                            <div>
                                <div className="bg-orange-100 border rounded-2xl p-2.5 mb-3 shadow-sm text-center">
                                    <h2 className="text-xs font-black text-slate-900 uppercase tracking-wider">📈 ตารางประมาณการกระแสเงินสดสะสมระยะยาว (Lifetime Cash Flow)</h2>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mb-3 text-center text-[11px] font-black">
                                    <div className="p-2 bg-slate-50 border rounded-xl">
                                        <p className="text-[8px] font-bold text-slate-400 uppercase mb-0.5">ระยะเวลาคืนทุนโครงการ</p>
                                        <p className="text-orange-600 text-sm font-black">{paybackPeriodStr} ปี</p>
                                    </div>
                                    <div className="p-2 bg-slate-50 border rounded-xl">
                                        <p className="text-[8px] font-bold text-slate-400 uppercase mb-0.5">ผลประโยชน์สะสมสุทธิ 25 ปี</p>
                                        <p className="text-emerald-700 text-sm font-black">{netLifetimeProfitStr} บ.</p>
                                    </div>
                                </div>

                                <table className="w-full text-left text-[9px] border rounded-xl overflow-hidden font-medium">
                                    <thead className="bg-slate-900 text-white font-bold text-[8px]">
                                        <tr>
                                            <th className="px-2.5 py-1">สิ้นปีที่</th>
                                            <th className="px-2.5 py-1">ประมาณการประหยัด/ปี</th>
                                            <th className="px-2.5 py-1">ยอดประโยชน์สะสม</th>
                                            <th className="px-2.5 py-1">กำไรสุทธิหลังหักเงินทุนโครงการ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y bg-white">
                                        {cashFlowData.map((item) => (
                                            <tr key={item.year}>
                                                <td className="px-2.5 py-[2.5px] font-bold">สิ้นปีที่ {item.year}</td>
                                                <td className="px-2.5 py-[2.5px] text-slate-600">{Math.round(item.yearlySaving).toLocaleString()} บ.</td>
                                                <td className="px-2.5 py-[2.5px] text-slate-600">{Math.round(item.cumulative).toLocaleString()} บ.</td>
                                                <td className={`px-2.5 py-[2.5px] font-black ${item.netProfit >= 0 ? "text-emerald-600" : "text-orange-500"}`}>
                                                    {item.netProfit >= 0 ? "+" : ""}{Math.round(item.netProfit).toLocaleString()} บ.
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="border-t pt-2 text-[9px] text-slate-500 font-sans">
                                <p className="font-black text-slate-800 mb-1">🛠️ เจ้าหน้าที่ประสานงานโครงการ</p>
                                <div className="grid grid-cols-3 gap-2 font-bold text-[8px]">
                                    <div className="bg-slate-50 p-1.5 border rounded-lg">ฝ่ายขาย: คุณมยุรา โทร 062-289-2261</div>
                                    <div className="bg-slate-50 p-1.5 border rounded-lg">บริการลูกค้า: คุณศุภลักษณ์ โทร 092-492-7722</div>
                                    <div className="bg-slate-50 p-1.5 border rounded-lg">ฝ่ายวิศวกรรม: คุณโมสต์ โทร 099-563-6837</div>
                                </div>
                                <div className="text-center text-[8px] font-black text-slate-400 mt-2">
                                    บริษัท ธันยธรณ์ เอ็นจิเนียริ่ง แอนด์ ดีเวลลอปเม้นท์ จํากัด | หน้า 2
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); 
    </script>
</body>
</html>
