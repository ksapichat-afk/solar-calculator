            "ศรีสะเกษ": 4.30, "สกลนคร": 4.15, "สงขลา": 3.80, "สตูล": 3.85, "สมุทรปราการ": 4.00,
            "สมุทรสงคราม": 4.02, "สมุทรสาคร": 4.05, "สระแก้ว": 4.15, "สระบุรี": 4.18, "สิงห์บุรี": 4.20,
            "สุโขทัย": 4.15, "สุพรรณบุรี": 4.22, "สุราษฎร์ธานี": 3.90, "สุรินทร์": 4.32, "หนองคาย": 4.12,
            "หนองบัวลำภู": 4.20, "อ่างทอง": 4.18, "อำนาจเจริญ": 4.25, "อุดรธานี": 4.20, "อุตรดิตถ์": 4.05,

        const App = () => {
            const [bill, setBill] = useState(5000);
            const [province, setProvince] = useState("กรุงเทพมหานคร");
            const [tariffType, setTariffType] = useState("normal"); 
            const [systemType, setSystemType] = useState("hybrid"); 
            
            const [dayUsage, setDayUsage] = useState(50);      
            const [eveningUsage, setEveningUsage] = useState(30);  
            const [nightUsage, setNightUsage] = useState(20);    

            const [phase, setPhase] = useState("1");
            const [batteryBrand, setBatteryBrand] = useState("Deye (ประกัน 10ปี)");
            const [batteryIndex, setBatteryIndex] = useState(0);

            const [isRegistered, setIsRegistered] = useState(false);
            const [showModal, setShowModal] = useState(true);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({ name: '', tel: '' });

            const [ac1Qty, setAc1Qty] = useState(0);
            const [ac1Hrs, setAc1Hrs] = useState(0);
            const [ac2Qty, setAc2Qty] = useState(0);
            const [ac2Hrs, setAc2Hrs] = useState(0);
            const [refQty, setRefQty] = useState(0);
            const [refHrs, setRefHrs] = useState(0);
            const [pumpQty, setPumpQty] = useState(0);
            const [pumpHrs, setPumpHrs] = useState(0);
            const [tvQty, setTvQty] = useState(0);
            const [tvHrs, setTvHrs] = useState(0);

            const canvasRef1 = useRef(null);
            const canvasRef2 = useRef(null);
            const chart1 = useRef(null);
            const chart2 = useRef(null);

            const sunHours = useMemo(() => PROVINCE_SUN_HOURS[province] || 4.0, [province]);

            const rates = useMemo(() => {
                if (tariffType === "tou") {
                    const avgRate = ((dayUsage * 5.8) + (eveningUsage * 5.8) + (nightUsage * 2.6)) / 100;
                    return { day: 5.8, evening: 5.8, night: 2.6, avg: avgRate || 4.2 };
                }
                return { day: 4.2, evening: 4.2, night: 4.2, avg: 4.2 };
            }, [tariffType, dayUsage, eveningUsage, nightUsage]);

            const eveningTotalWh = useMemo(() => {
                return (900 * ac1Qty * ac1Hrs) +
                       (1800 * ac2Qty * ac2Hrs) +
                       (200 * refQty * refHrs) +
                       (500 * pumpQty * pumpHrs) +
                       (150 * tvQty * tvHrs);
            }, [ac1Qty, ac1Hrs, ac2Qty, ac2Hrs, refQty, refHrs, pumpQty, pumpHrs, tvQty, tvHrs]);

            const minBatterySize = useMemo(() => {
                return eveningTotalWh / (1000 * 0.8);
            }, [eveningTotalWh]);

            // ล็อกตัวแปรป้องกันดัชนีหลุดขอบเขตอาร์เรย์แบตเตอรี่แบบ Real-time ป้องกันบราวเซอร์แครชจอขาว
            const brandGroup = useMemo(() => BATTERY_OPTIONS[batteryBrand] || [], [batteryBrand]);
            const safeBatteryIndex = useMemo(() => {
                return batteryIndex >= brandGroup.length ? 0 : batteryIndex;
            }, [batteryIndex, brandGroup]);

            const currentBatteryItem = useMemo(() => {
                return brandGroup[safeBatteryIndex] || { cap: "5.12 kWh", price: 0 };
            }, [brandGroup, safeBatteryIndex]);

            const selectedBatteryCapStr = currentBatteryItem.cap;
            const estBatteryCost = useMemo(() => {
                return systemType === "hybrid" ? currentBatteryItem.price : 0;
            }, [systemType, currentBatteryItem]);

            const handleDayChange = (val) => {
                const newDay = Math.min(100, Math.max(0, Number(val)));
                setDayUsage(newDay);
                if (newDay + eveningUsage > 100) {
                    setEveningUsage(100 - newDay);
                    setNightUsage(0);
                } else {
                    setNightUsage(100 - newDay - eveningUsage);
                }
            };

            const handleEveningChange = (val) => {
                const newEve = Math.min(100, Math.max(0, Number(val)));
                if (dayUsage + newEve > 100) {
                    setEveningUsage(100 - dayUsage);
                    setNightUsage(0);
                } else {
                    setEveningUsage(newEve);
                    setNightUsage(100 - dayUsage - newEve);
                }
            };

            const handleNightChange = (val) => {
                const newNight = Math.min(100, Math.max(0, Number(val)));
                if (dayUsage + newNight > 100) {
                    setNightUsage(100 - dayUsage);
                    setEveningUsage(0);
                } else {
                    setNightUsage(newNight);
                    setEveningUsage(100 - dayUsage - newNight);
                }
            };

            const solarSize = useMemo(() => {
                const currentBill = parseFloat(bill) || 0;
                const totalUnitsPerMonth = currentBill / rates.avg;
                const unitsNeededPerDay = totalUnitsPerMonth / 30;
                const factor = systemType === "hybrid" ? (dayUsage + (eveningUsage * 0.7)) / 100 : dayUsage / 100;
                const dayUnits = unitsNeededPerDay * factor;
                return (dayUnits / sunHours).toFixed(2);
            }, [bill, sunHours, dayUsage, eveningUsage, systemType, rates.avg]);

            const matchedPackage = useMemo(() => {
                const size = parseFloat(solarSize) || 0;
                const typeGroup = SOLAR_PACKAGES[systemType] || {};
                const packages = typeGroup[phase] || [];
                let selected = packages.find(p => size <= p.maxSize);
                if (!selected && packages.length > 0) {
                    selected = packages[packages.length - 1];
                }
                return selected;
            }, [solarSize, systemType, phase]);
            
            const isPhaseWarning = useMemo(() => {
                return phase === "1" && parseFloat(solarSize) > 5.5;
            }, [phase, solarSize]);

            const estInvestment = useMemo(() => {
                if (!matchedPackage) return 0;
                return matchedPackage.price + estBatteryCost;
            }, [matchedPackage, estBatteryCost]);

            const estSaving = useMemo(() => {
                if (!matchedPackage) return 0;
                const currentBill = parseFloat(bill) || 0;
                const totalUnitsPerMonth = currentBill / rates.avg;
                const dayUnitsPerMonth = totalUnitsPerMonth * (dayUsage / 100);
                const maxPackageDayProduction = matchedPackage.kwpSize * sunHours * 30; 
                const daySavings = Math.min(dayUnitsPerMonth, maxPackageDayProduction) * rates.day;
                
                let eveningSavings = 0;
                if (systemType === "hybrid") {
                    const battCapacity = parseFloat(selectedBatteryCapStr) || 5.12;
                    const maxBatteryOutputPerMonth = battCapacity * 0.8 * 30; 
                    const eveningUnitsPerMonth = totalUnitsPerMonth * (eveningUsage / 100);
                    eveningSavings = Math.min(eveningUnitsPerMonth, maxBatteryOutputPerMonth) * rates.evening;
                }
                return (daySavings + eveningSavings).toFixed(0);
            }, [matchedPackage, sunHours, dayUsage, eveningUsage, bill, systemType, selectedBatteryCapStr, rates.day, rates.evening, rates.avg]);

            const cashFlowData = useMemo(() => {
                const years = Array.from({length: 25}, (_, i) => i + 1);
                let cumulative = 0;
                return years.map(year => {
                    const yearlySaving = estSaving * 12 * Math.pow(0.995, year - 1);
                    cumulative += yearlySaving;
                    const netProfit = cumulative - estInvestment;
                    return { year, yearlySaving, cumulative, netProfit };
                });
            }, [estSaving, estInvestment]);

            const condensedCashFlow = useMemo(() => {
                return cashFlowData.filter(item => item.year <= 10 || item.year === 15 || item.year === 20 || item.year === 25);
            }, [cashFlowData]);

            // ดึงค่าข้อความล่วงหน้าเพื่อความปลอดภัย ปลอดสัญลักษณ์คำถามจุดใน JSX 
            const packageNameStr = matchedPackage ? matchedPackage.name : "-";
            const packagePriceStr = matchedPackage ? Number(matchedPackage.price).toLocaleString() : "0";
            const packagePanelsStr = matchedPackage ? matchedPackage.panels : "0";
            const packageAreaStr = matchedPackage ? matchedPackage.area : "0";
            const paybackPeriodStr = (estInvestment / (estSaving * 12 || 1)).toFixed(1);
            const netLifetimeProfitStr = Math.round(estSaving * 12 * (1 - Math.pow(0.995, 25)) / 0.005).toLocaleString();

            // ดักจับวงจรวาดกราฟแท่งทั้ง 2 ชุดอิสระ เพื่อประสิทธิภาพสูงสุด
            useEffect(() => {
                const buildChart = (canvasRef, chartRefRef) => {
                    if (!canvasRef.current) return;
                    const ctx = canvasRef.current.getContext('2d');
                    if (chartRefRef.current) chartRefRef.current.destroy();

                    const labels = Array.from({length: 25}, (_, i) => "ปีที่ " + (i + 1));
                    let cumulativeSaving = 0;
                    const dataSaving = labels.map((_, i) => {
                        cumulativeSaving += estSaving * 12 * Math.pow(0.995, i);
                        return Math.round(cumulativeSaving);
                    });

                    chartRefRef.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'ประหยัดสะสม (บาท)', data: dataSaving, backgroundColor: 'rgba(30, 58, 138, 0.6)', borderColor: '#1e3a8a', borderWidth: 1, order: 2 },
                                { label: 'เงินลงทุนรวมทั้งโครงการ (บาท)', data: Array(25).fill(estInvestment), borderColor: '#ef4444', borderWidth: 2, borderDash: [5, 5], type: 'line', fill: false, pointRadius: 0, order: 1 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 10 } } } },
                            scales: {
                                y: { beginAtZero: true, ticks: { font: { family: 'Sarabun', size: 9 }, callback: (v) => v.toLocaleString() + ' บ.' } },
                                x: { ticks: { font: { family: 'Sarabun', size: 9 } } }
                            }
                        }
                    });
                };

                buildChart(canvasRef1, chart1);
                buildChart(canvasRef2, chart2);

                return () => {
                    if (chart1.current) chart1.current.destroy();
                    if (chart2.current) chart2.current.destroy();
                };
            }, [estSaving, estInvestment]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({

                            email: `V6.3.0|Type2Print|Type:${systemType}`

                    setShowModal(false);
                } catch (error) {

                    setShowModal(false);
                } finally {

                }

            const executePrint = () => {
                window.print();
            };

            return (
                <div className="min-h-screen flex flex-col">

                    <div className="screen-layout no-print">

                        </header>

                        <main className="max-w-4xl mx-auto p-4 md:p-8 w-full text-slate-800">
                            <section className="bg-white rounded-[2rem] shadow-2xl p-6 md:p-10 mb-8 border border-slate-100 animate-fade-in">
                                <div className="grid md:grid-cols-2 gap-x-8 gap-y-4 mb-8">
                                    
                                    <div className="space-y-1">
                                        <label className="font-bold text-slate-700 text-sm ml-1">👤 ชื่อ-นามสกุล ของลูกค้า:</label>
                                        <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none font-bold text-base" placeholder="ระบุชื่อลูกค้าเพื่อออกเอกสารทางการ" />
                                    </div>

                        ======================================================================== */}
                    <div className="print-layout bg-white p-0">
                        
                        {/* 📄 เอกสารแผ่นที่ 1 : หัวจดหมายบริษัท + ข้อมูลลูกค้า + กำลังผลิตแนะนำ + ราคาแพ็คเกจแนะนำ */}
                        <div className="a4-sheet flex flex-col justify-between">
                            <div>
                                <div className="border-b-4 border-slate-900 pb-4 mb-6">
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <h2 className="text-base font-black text-slate-900 tracking-tight">เล่มรายงานวิเคราะห์ผลประโยชน์การลงทุนระบบพลังงานแสงอาทิตย์</h2>
                                            <p className="text-[9px] text-slate-500 font-bold uppercase tracking-wider mt-0.5">TECHNICAL FINANCING INVESTMENT PROPOSAL — OFFICIAL DOCUMENT</p>
                                        </div>
                                        <div className="text-right flex-shrink-0">
                                            <p className="text-xs font-black text-blue-900">บริษัท ธัญญธรณ์ เอ็นจิเนียริ่ง แอนด์ ดีเวลลอปเม้นท์ จํากัด</p>
                                            <p className="text-[9px] text-slate-400 font-medium">Premium Architecture Solutions</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-2 border-l-4 border-slate-800 pl-2">1. รายละเอียดข้อมูลลูกค้าคู่สัญญาและพารามิเตอร์ฐาน (Customer Profile)</h3>
                                    <div className="grid grid-cols-2 bg-slate-50 border border-slate-200 rounded-xl p-4 gap-y-2 text-xs font-bold text-slate-700">
                                        <div>ชื่อ-นามสกุล ของลูกค้า: <span className="text-slate-950 font-black">{formData.name || '-'}</span></div>
                                        <div>จังหวัดสถานที่ติดตั้งอาคาร: <span className="text-slate-950 font-black">จังหวัด {province}</span></div>
                                        <div>เบอร์โทรศัพท์ติดต่อ: <span className="text-slate-950 font-black">{formData.tel || '-'}</span></div>
                                        <div>เกณฑ์คำนวณฐานค่าไฟเดิม: <span className="text-slate-950 font-black">เดือนละ {Number(bill).toLocaleString()} บาท</span></div>
                                        <div>ประเภทสถาปัตยกรรมระบบ: <span className="text-slate-950 font-black uppercase">{systemType} System</span></div>
                                        <div>สัดส่วนพฤติกรรมการใช้ไฟ: <span className="text-slate-950 font-black">กลางวัน {dayUsage}% / ค่ำ {eveningUsage}% / ดึก {nightUsage}%</span></div>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-2 border-l-4 border-slate-800 pl-2">2. ขนาดกำลังการผลิตติดตั้งระบบแนะนำเชิงวิศวกรรม (Recommended Capacity)</h3>
                                    <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 flex justify-between items-center">
                                        <div>
                                            <p className="text-xs text-blue-950 font-bold">ขนาดติดตั้งแผงโซล่าเซลล์รวมที่คุ้มค่าทางเศรษฐศาสตร์สูงสุด</p>
                                            <p className="text-[9px] text-slate-400 font-medium mt-0.5">*คำนวณประมวลผลสอดคล้องตรงตามสถิติความเข้มแสงอาทิตย์จริงในเขตจังหวัด {province}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xl font-black text-slate-900">{solarSize}</span>
                                            <span className="text-xs font-bold text-slate-500 ml-1">kWp</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-2 border-l-4 border-slate-800 pl-2">3. ชุดรายละเอียดแพ็กเกจราคาและงบเงินลงทุนรวม (Investment Packages)</h3>
                                    <div className="border border-slate-200 rounded-xl p-4 text-xs font-bold space-y-3 bg-white">
                                        <div className="flex justify-between items-center text-slate-800">
                                            <span>1. {packageNameStr} (ราคาฐานระบบแผงหลัก + อินเวอร์เตอร์เกรดระดับโลก):</span>
                                            <span className="font-black text-slate-950">{packagePriceStr} บ.</span>
                                        </div>
                                        <div className="text-[10px] text-slate-400 font-normal pl-3 leading-relaxed text-slate-500">
                                            * โครงสร้างอุปกรณ์: แผงพลังงานพรีเมียม JA Solar (Tier-1) จำนวน {packagePanelsStr} แผง | ใช้พื้นที่ติดตั้งหลังคาประมาณ {packageAreaStr} ตารางเมตร
                                        </div>
                                        {systemType === "hybrid" && (
                                            <div className="flex justify-between items-center text-blue-800 border-t border-slate-100 pt-2 font-bold">
                                                <span>2. แบตเตอรี่แอดออนเสริมความปลอดภัยสำหรับอินเวอร์เตอร์ Hybrid [{selectedBatteryCapStr}]:</span>
                                                <span className="font-black">+{Number(estBatteryCost).toLocaleString()} บ.</span>
                                            </div>
                                        )}
                                        <div className="border-t border-dashed border-slate-300 pt-3 flex justify-between items-baseline text-slate-900 font-black">
                                            <span className="text-xs">💰 มูลค่ารวมเงินลงทุนรวมสุทธิทั้งโครงการ (รวมภาษีมูลค่าเพิ่ม):</span>
                                            <span className="text-emerald-600 text-xl tracking-tight">{Number(estInvestment).toLocaleString()} บาท</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="text-[9px] text-slate-400 font-medium text-center border-t border-slate-100 pt-2">หน้า 1 / เล่มข้อเสนอโครงการ TYE SOLARMASTER</div>
                        </div>

                        {/* 📄 เอกสารแผ่นที่ 2 : กราฟแท่ง + สรุปผลตอบแทน + ตารางจุดคุ้มทุนแบบย่อเรียงปี + รายชื่อผู้ประสานงาน */}
                        <div className="a4-sheet flex flex-col justify-between">
                            <div>
                                <div className="border-b border-slate-200 pb-1 mb-4">
                                    <p className="text-xs font-black text-slate-900 uppercase tracking-widest">📈 แบบจำลองงบกระแสเงินสดสะสมและระยะเวลาคืนทุน (Financial return Simulation)</p>
                                </div>

                                <div className="mb-4 bg-white border border-slate-200 p-2 rounded-xl">
                                    <div className="h-52 w-full relative">
                                        <canvas ref={canvasRef2}></canvas>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                        <p className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">ระยะเวลาคืนทุนรายปี (Payback Period)</p>
                                        <p className="text-orange-600 text-xl font-black">{paybackPeriodStr} <span className="text-xs font-bold text-slate-500">ปี</span></p>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                        <p className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">มูลค่ารวมผลประหยัดรายปีสะสมสุทธิ 25 ปี</p>
                                        <p className="text-emerald-700 text-xl font-black">{netLifetimeProfitStr} บ.</p>
                                    </div>
                                </div>

                                <div className="mb-4">
                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-wider mb-1.5 border-l-4 border-slate-800 pl-2">4. ตารางพยากรณ์แจกแจงกระแสเงินสดสะสมแบบสรุปย่อ (Condensed Cash Flow Table)</h3>
                                    <table className="w-full text-left text-xs border border-slate-200 rounded-xl overflow-hidden font-medium">
                                        <thead className="bg-slate-900 text-white font-bold text-[9px] uppercase">
                                            <tr>
                                                <th className="px-3 py-1.5">คาดการณ์สิ้นปี</th>
                                                <th className="px-3 py-1.5">ผลประโยชน์ประหยัดต่อปี</th>
                                                <th className="px-3 py-1.5">ยอดเงินประหยัดสะสม</th>
                                                <th className="px-3 py-1.5">กำไรสุทธิสะสมหลังหักทุน</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 bg-white">
                                            {condensedCashFlow.map((item) => (
                                                <tr key={item.year} className={item.netProfit >= 0 ? "bg-emerald-50/20" : ""}>
                                                    <td className="px-3 py-1 font-bold text-slate-900">สิ้นปีที่ {item.year}</td>
                                                    <td className="px-3 py-1 text-slate-600">{Math.round(item.yearlySaving).toLocaleString()} บ.</td>
                                                    <td className="px-3 py-1 text-slate-600">{Math.round(item.cumulative).toLocaleString()} บ.</td>
                                                    <td className={`px-3 py-1 font-black ${item.netProfit >= 0 ? "text-emerald-600" : "text-orange-500"}`}>
                                                        {item.netProfit >= 0 ? "+" : ""}{Math.round(item.netProfit).toLocaleString()} บ.
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="border-t-2 border-slate-900 pt-3 font-sans text-[10px]">
                                <p className="font-black text-slate-900 uppercase tracking-widest mb-2">🛠️ เจ้าหน้าที่วิศวกรผู้ประสานงานโครงการ (TYE SOLAR PROJECT COORDINATORS)</p>
                                <div className="grid grid-cols-3 gap-3 text-slate-600 font-bold">
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                        <p className="font-black text-slate-800">ฝ่ายขายและการตลาด</p>
                                        <p className="font-medium text-slate-500 mt-0.5">คุณมยุรา (จอย)</p>
                                        <p className="text-blue-900 font-extrabold">โทร: 062-289-2261</p>
                                    </div>
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                        <p className="font-black text-slate-800">ฝ่ายบริการลูกค้า</p>
                                        <p className="font-medium text-slate-500 mt-0.5">คุณศุภลักษณ์ (อัฐ)</p>
                                        <p className="text-blue-900 font-extrabold">โทร: 092-492-7722</p>
                                    </div>
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                        <p className="font-black text-slate-800">ฝ่ายเทคนิคและวิศวกรรม</p>
                                        <p className="font-medium text-slate-500 mt-0.5">คุณโมสต์</p>
                                        <p className="text-blue-900 font-extrabold">โทร: 099-563-6837</p>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center mt-3 text-[8px] text-slate-400 border-t border-slate-100 pt-1.5 font-normal">
                                    <span>* แผนภาพจัดทำจำลองบนสถิติฐานเศรษฐศาสตร์วิศวกรรมของ TYE Solar ในปี 2026</span>
                                    <span>หน้า 2 / เล่มข้อเสนอโครงการ TYE SOLARMASTER</span>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* กล่องลงทะเบียนเปิดสิทธิ์ใช้งานระบบแบบแมนนวลดั้งเดิมคงไว้ครบถ้วน */}
                    {showModal && !isRegistered && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-[2.5rem] p-8 md:p-12 max-w-md w-full shadow-2xl text-center">
                                <h3 className="text-2xl font-black mb-2 text-slate-800 italic">⭐ TYE Solar Audit</h3>
                                <p className="text-slate-500 text-sm mb-8 leading-relaxed font-medium">ระบุข้อมูลของคุณเพื่อเข้าใช้งานระบบประมวลผลคำนวณจุดคุ้มทุน</p>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div className="text-left">
                                        <label className="text-[10px] font-bold text-slate-400 ml-3 mb-1 block uppercase tracking-widest">Installation Province</label>
                                        <select value={province} onChange={(e) => setProvince(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl focus:border-blue-500 outline-none font-bold text-slate-700 cursor-pointer">
                                            {Object.keys(PROVINCE_SUN_HOURS).sort().map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    <input required type="text" placeholder="ชื่อ-นามสกุล ของคุณ" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                    <input required type="tel" placeholder="เบอร์โทรศัพท์ติดต่อ" className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 font-medium" value={formData.tel} onChange={(e) => setFormData({...formData, tel: e.target.value})} />
                                    <input type="submit" disabled={isLoading} value={isLoading ? "Processing..." : "เปิดระบบคำนวณโปรโมชั่น"} className="w-full text-center block bg-blue-700 hover:bg-blue-800 text-white font-black py-5 rounded-2xl mt-6 shadow-xl active:scale-95 transition-all text-lg cursor-pointer" />
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
